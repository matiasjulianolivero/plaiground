function cv(id){if(id==='quad')return quadCover();const W=800,H=500;const d=(s)=>dec(s);
  const base=(g1,g2,inner)=>`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${id})"/>${inner}</svg>`;
  const big=(t,x=60,y=430,s=150)=>`<text x="${x}" y="${y}" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="${s}" fill="#fff" opacity=".95">${t}</text>`;
  switch(id){
  case 'leon':{let c='';for(let i=0;i<7;i++)c+=`<path d="M${i*38} 0 Q${i*38+19} 60 ${i*38+38} 0 L${i*38+38} ${H} L${i*38} ${H}Z" fill="#7F1D1D" opacity="${.55+i*.05}"/><path d="M${W-i*38} 0 Q${W-i*38-19} 60 ${W-i*38-38} 0 L${W-i*38-38} ${H} L${W-i*38} ${H}Z" fill="#7F1D1D" opacity="${.55+i*.05}"/>`;
    return base('#F59E0B','#BE185D',`<ellipse cx="400" cy="520" rx="330" ry="140" fill="#FDE68A" opacity=".35"/><polygon points="400,-20 250,500 550,500" fill="#FEF3C7" opacity=".18"/>${c}<circle cx="400" cy="210" r="90" fill="#FDE68A" opacity=".9"/>${big('51'+(LANG==='en'?'%':' %'),270,300,110)}<text x="400" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${L('de sus ingresos, del teatro','of revenue from the stage')}</text>`);}
  case 'poke':{return base('#2563EB','#7C3AED',`<circle cx="640" cy="250" r="125" fill="none" stroke="#FACC15" stroke-width="54"/><circle cx="640" cy="250" r="125" fill="none" stroke="#fff" stroke-width="58" stroke-dasharray="${(2*Math.PI*125*0.009+4).toFixed(1)} 2000" transform="rotate(-90 640 250)"/><circle cx="640" cy="250" r="64" fill="#fff" opacity=".15"/>${big(d('0.9')+(LANG==='en'?'%':' %'),50,300,130)}<text x="56" y="350" font-size="26" font-weight="700" fill="#fff">${L('de sus ingresos viene del cine','of its revenue comes from cinema')}</text>`);}
  case 'duel':return base('#B91C1C','#111827',`<polygon points="0,0 470,0 330,500 0,500" fill="#DC2626"/><polygon points="470,0 800,0 800,500 330,500" fill="#0F172A"/><text x="60" y="270" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="120" fill="#fff">${d('83.3')}</text><text x="64" y="320" font-size="28" font-weight="700" fill="#fff">Marvel</text><text x="740" y="270" text-anchor="end" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="120" fill="#FDE047">${d('82.9')}</text><text x="736" y="320" text-anchor="end" font-size="28" font-weight="700" fill="#FDE047">Star Wars</text><text x="400" y="460" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" opacity=".85">${L('0,4 puntos de diferencia','0.4 points apart')}</text>`);
  case 'anime':{let r='';for(let i=0;i<16;i++){const a=i/16*Math.PI*2;r+=`<line x1="${600+Math.cos(a)*120}" y1="${250+Math.sin(a)*120}" x2="${600+Math.cos(a)*420}" y2="${250+Math.sin(a)*420}" stroke="#fff" stroke-width="${i%2?14:26}" opacity=".18"/>`;}
    return base('#F97316','#DB2777',`${r}<circle cx="600" cy="250" r="115" fill="#fff"/><circle cx="600" cy="250" r="115" fill="#DC2626" opacity=".9"/>${big('6º · 8º',50,250,110)}<text x="56" y="310" font-size="28" font-weight="700" fill="#fff">Demon Slayer · Dragon Ball</text>`);}
  case 'amp':{let c='';const pts=R.map(r=>[60+r.d[9]/15*680,460-(r.idx-50)/40*400]);pts.forEach(([x,y])=>c+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="9" fill="#fff" opacity=".8"/>`);
    return base('#0EA5E9','#4338CA',`<line x1="60" y1="460" x2="740" y2="80" stroke="#FDE047" stroke-width="6" stroke-dasharray="14 10"/>${c}${big('r = '+d('0.73'),60,140,90)}`);}
  case 'parks':{let s='';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;s+=`<line x1="560" y1="230" x2="${560+Math.cos(a)*170}" y2="${230+Math.sin(a)*170}" stroke="#fff" stroke-width="4" opacity=".7"/><rect x="${560+Math.cos(a)*170-14}" y="${230+Math.sin(a)*170-10}" width="28" height="22" rx="6" fill="#FDE047"/>`;}
    return base('#14B8A6','#6366F1',`<circle cx="560" cy="230" r="170" fill="none" stroke="#fff" stroke-width="8"/>${s}<circle cx="560" cy="230" r="18" fill="#fff"/><path d="M500 500 L560 230 L620 500" stroke="#fff" stroke-width="10" fill="none"/>${big('24',60,300,180)}<text x="66" y="350" font-size="28" font-weight="700" fill="#fff">${L('franquicias con parque','franchises with a park')}</text>`);}
  case 'mine':{let b='';const v=[100,61,47,43,24,17,10];v.forEach((x,i)=>{const h=x/100*330;for(let j=0;j<Math.ceil(h/30);j++)b+=`<rect x="${480+i*46}" y="${440-(j+1)*30}" width="40" height="26" fill="${i===0?'#FDE047':'#fff'}" opacity="${i===0?1:.55}"/>`;});
    return base('#16A34A','#065F46',`${b}${big(d('7.8')+'×',50,260,130)}<text x="56" y="310" font-size="26" font-weight="700" fill="#fff">${L('más búsquedas que Star Wars','more searches than Star Wars')}</text>`);}
  case 'warren':return base('#1E1B4B','#581C87',`<rect x="560" y="70" width="90" height="380" rx="12" fill="#C084FC"/><rect x="680" y="410" width="40" height="40" rx="8" fill="#fff" opacity=".4"/>${big(d('10.6')+'×',50,260,130)}<text x="56" y="310" font-size="26" font-weight="700" fill="#fff">${L('rentabilidad… y solo 2 negocios','profitability… and only 2 businesses')}</text>`);}}
const POSTS=[
 {id:'leon',k:'El Rey León',es:{t:'El Rey León ruge más fuerte en el teatro que en el cine',dek:'La mitad de sus ingresos viene del escenario, no de la pantalla.',b:['El Rey León tiene la estructura de ingresos más rara del barómetro. De sus 15,9 mil millones de dólares, 8,1 (el 51 %) proceden de experiencias y teatro, sobre todo del musical de Broadway que lleva en cartel desde 1997. El cine solo aporta el 21 %.','No es un caso aislado. Las 11 franquicias que tienen teatro o musical sacan de media 74,5 puntos en la nota final, frente a 65,8 de las que no lo tienen. Teatro y espectáculos en vivo, además, casi siempre van juntos: el 91 % de las sagas con musical también hace giras o conciertos.','La otra cara: El Rey León es fuerte en Vende (80 puntos) pero flojo en Engancha (42,4), porque su comunidad digital es pequeña. Su reto no es vender más entradas, sino convertir a quien sale del teatro en seguidor.'],fig:['51 %','de sus ingresos viene de experiencias y teatro']},
  en:{t:'The Lion King roars louder on stage than on screen',dek:'Half of its revenue comes from the theatre, not from cinemas.',b:['The Lion King has the most unusual revenue mix in the barometer. Of its $15.9 billion, $8.1 billion (51%) comes from experiences and theatre, mostly the Broadway musical running since 1997. Cinema brings in only 21%.','It is not a one-off. The 11 franchises with a stage play or musical average 74.5 points in the final score, versus 65.8 for those without. Theatre and live shows also go together: 91% of sagas with a musical also tour or play in concert.','The flip side: The Lion King is strong on Business (80 points) but weak on Buzz (42.4) because its digital community is small. Its challenge is not selling more tickets, but turning people leaving the theatre into followers.'],fig:['51%','of its revenue comes from experiences and theatre']}},
 {id:'poke',k:'Pokémon',es:{t:'Pokémon: 130.700 millones y casi nada de cine',dek:'La marca que más factura del barómetro apenas depende de sus películas.',b:['Pokémon ingresa 130,7 mil millones de dólares, casi tres veces más que Star Wars. Solo el 0,9 % viene de los cines; el 91 % son productos y licencias: cartas, peluches, juguetes y todo lo que lleva un Pikachu.','Aun así, es 22ª en el ranking. La razón está en Gusta: sus películas tienen un 31 % de críticas positivas, la peor nota de crítica de las 41. Para Pokémon el cine es publicidad, no negocio.','El patrón se repite: las 18 sagas que sacan menos del 30 % de sus ingresos del cine tienen una nota media de 71,1. Las 14 que dependen del cine en más de un 70 % se quedan en 65,2. Depender menos de la taquilla parece ser una ventaja.'],fig:['0,9 %','de sus ingresos viene del cine']},
  en:{t:'Pokémon: $130.7 billion and almost no cinema',dek:'The highest-earning brand in the barometer barely relies on its films.',b:['Pokémon earns $130.7 billion, nearly three times Star Wars. Only 0.9% comes from cinemas; 91% is merchandise and licensing: cards, plush toys and everything with a Pikachu on it.','Even so, it ranks 22nd. The reason is Appeal: its films get 31% positive reviews, the lowest critics score of all 41. For Pokémon, film is advertising, not the business.','The pattern repeats: the 18 sagas that earn less than 30% of their revenue at the box office average a 71.1 score. The 14 that rely on cinema for more than 70% stay at 65.2. Depending less on the box office looks like an advantage.'],fig:['0.9%','of its revenue comes from cinema']}},
 {id:'duel',k:'Marvel',es:{t:'Marvel contra Star Wars: un empate de 0,4 puntos',dek:'Dos imperios de Disney casi idénticos que ganan de formas opuestas.',b:['Marvel (83,3) y Star Wars (82,9) comparten el 93 % de su huella de negocio: los dos tienen parque, LEGO, cartas, Fortnite, cruceros y series. Son gemelos de ecosistema.','Pero su dinero llega por caminos distintos. El 79 % de los ingresos de Marvel sale de los cines; Star Wars gana el 62 % con productos y licencias. Marvel es una máquina de estrenos; Star Wars, una marca que se vende sola en la juguetería.','El desempate está en Engancha: Marvel tiene 102,3 millones de seguidores en Instagram frente a 17,1 de Star Wars. Star Wars responde con más Óscar (7 frente a 4) y más búsquedas en Google.'],fig:['0,4','puntos separan al primero del segundo']},
  en:{t:'Marvel vs Star Wars: a 0.4-point tie',dek:'Two near-identical Disney empires that win in opposite ways.',b:['Marvel (83.3) and Star Wars (82.9) share 93% of their business footprint: both have parks, LEGO, cards, Fortnite, cruises and series. They are ecosystem twins.','But their money arrives by different routes. 79% of Marvel’s revenue comes from cinemas; Star Wars earns 62% from merchandise and licensing. Marvel is a release machine; Star Wars is a brand that sells itself in the toy aisle.','The tiebreaker is Buzz: Marvel has 102.3 million Instagram followers versus 17.1 million for Star Wars. Star Wars answers with more Oscars (7 to 4) and more Google searches.'],fig:['0.4','points between first and second']}},
 {id:'anime',k:'Demon Slayer',es:{t:'El anime ya juega en primera división',dek:'Demon Slayer y Dragon Ball están en el top 10 con muchas menos películas que Hollywood.',b:['Demon Slayer es 6ª y Dragon Ball 8ª, por delante de Avatar, DC o Frozen. Demon Slayer tiene la mejor crítica del barómetro (97,5 %) y es la más rentable: su taquilla multiplica casi 40 veces el presupuesto.','Su fuerza está fuera del cine. Dragon Ball saca el 56 % de sus ingresos de productos y Demon Slayer el 87 %. Juntas, las empresas japonesas cubren 15 de los 16 tipos de negocio, igual que Disney.','Su punto débil es la comunidad: ni Demon Slayer ni Dragon Ball tienen una cuenta oficial global en Instagram, así que su nota de Engancha sale solo de las búsquedas. Con una cuenta global, podrían escalar puestos.'],fig:['97,5 %','de críticas positivas para Demon Slayer']},
  en:{t:'Anime now plays in the top league',dek:'Demon Slayer and Dragon Ball reach the top 10 with far fewer films than Hollywood.',b:['Demon Slayer ranks 6th and Dragon Ball 8th, ahead of Avatar, DC and Frozen. Demon Slayer has the best reviews in the barometer (97.5%) and is the most profitable: its box office is almost 40 times its budget.','Their strength is beyond cinema. Dragon Ball earns 56% of its revenue from merchandise and Demon Slayer 87%. Together, Japanese companies cover 15 of the 16 business types, the same as Disney.','Their weak spot is community: neither Demon Slayer nor Dragon Ball has a global official Instagram account, so their Buzz score comes from searches alone. A global account could move them up.'],fig:['97.5%','positive reviews for Demon Slayer']}},
 {id:'amp',k:'Marvel',es:{t:'Cuantos más negocios, mejor nota',dek:'La amplitud del ecosistema es lo que más se parece a la nota final.',b:['Si comparamos cuántos negocios tiene cada franquicia con su nota final, la relación es muy fuerte: un coeficiente de correlación de 0,73 sobre 1. Las 10 primeras del ranking tienen de media 11,5 negocios; las 10 últimas, 4,6.','Hay que leerlo con cuidado: el ecosistema forma parte de la nota, pero solo pesa un 9 %. El resto de la relación viene de que las sagas con más negocios también son las que más venden y más enganchan.','La lectura para una marca es clara: cada nuevo negocio (un parque, un musical, un juego de cartas) no solo suma ingresos, también mantiene viva la saga entre estreno y estreno.'],fig:['0,73','correlación entre amplitud y nota final']},
  en:{t:'More businesses, higher scores',dek:'Ecosystem breadth is what most closely tracks the final score.',b:['When we compare how many businesses each franchise has with its final score, the link is strong: a correlation coefficient of 0.73 out of 1. The top 10 average 11.5 businesses; the bottom 10, 4.6.','Read it with care: the ecosystem is part of the score, but it only weighs 9%. The rest of the link comes from the fact that sagas with more businesses also sell more and create more buzz.','The takeaway for a brand is clear: each new business (a park, a musical, a card game) does not just add revenue, it keeps the saga alive between releases.'],fig:['0.73','correlation between breadth and final score']}},
 {id:'parks',k:'Wizarding World (Harry Potter)',es:{t:'Parques temáticos: el club de las 24',dek:'Tener un lugar físico se nota sobre todo en lo que vende la franquicia.',b:['24 de las 41 franquicias tienen hoy un parque, una zona o una atracción propia abierta. Otras 3 lo tienen anunciado (Barbie, Minecraft y Dragon Ball) y 4 solo con eventos temporales.','Las sagas con parque sacan 74,4 puntos en Vende frente a 68,1 de las que no lo tienen, y su nota final media es 3 puntos más alta. 6 de las 10 primeras del ranking tienen parque; de las 10 últimas, solo 2.','Los parques también explican alianzas curiosas: Marvel vive a la vez en Disney y en Universal, y Harry Potter, propiedad de Warner, tiene su mundo mágico en parques Universal bajo licencia.'],fig:['24','franquicias con parque abierto']},
  en:{t:'Theme parks: the club of 24',dek:'Having a physical place shows up mostly in how much a franchise sells.',b:['24 of the 41 franchises have an open park, land or ride of their own. Three more have one announced (Barbie, Minecraft and Dragon Ball) and four only run temporary events.','Sagas with a park score 74.4 on Business versus 68.1 for those without, and their average final score is 3 points higher. Six of the top 10 have a park; only two of the bottom 10 do.','Parks also explain some odd alliances: Marvel lives in both Disney and Universal parks, and Harry Potter, owned by Warner, has its wizarding world in Universal parks under licence.'],fig:['24','franchises with an open park']}},
 {id:'mine',k:'Minecraft',es:{t:'Minecraft, la saga más buscada con una sola película',dek:'Una película y 7,8 veces más búsquedas que Star Wars.',b:['Minecraft solo tiene una película en el análisis, pero en Google se la busca 7,8 veces más que a Star Wars. Es la franquicia con más enganche de todo el barómetro: 91,6 puntos en Engancha.','La crítica no la acompaña (48 % de reseñas positivas), y por eso se queda en el puesto 16. Su negocio está en el juego: el 49 % de sus ingresos viene de los videojuegos.','Minecraft demuestra que el interés del público puede ir muy por delante del cine. Con el parque anunciado en Reino Unido para 2027 y una serie en camino, tiene margen para seguir subiendo.'],fig:['7,8×','las búsquedas de Star Wars']},
  en:{t:'Minecraft, the most searched saga with a single film',dek:'One film and 7.8 times more searches than Star Wars.',b:['Minecraft has only one film in the analysis, yet it is searched 7.8 times more than Star Wars on Google. It is the franchise with the most buzz in the barometer: 91.6 points on Buzz.','Critics are less kind (48% positive reviews), which is why it sits 16th. Its business is the game: 49% of its revenue comes from video games.','Minecraft shows that public interest can run far ahead of cinema. With a UK park announced for 2027 and a series on the way, it has room to keep climbing.'],fig:['7.8×','Star Wars’ search interest']}},
 {id:'warren',k:'Universo Expediente Warren',es:{t:'Rentable no es lo mismo que fuerte: el caso Expediente Warren',dek:'Multiplica por 10 su presupuesto y aun así está en el puesto 39.',b:['El Universo Expediente Warren es uno de los mejores negocios del cine: su taquilla multiplica 10,6 veces lo que cuestan sus películas. Solo Demon Slayer, Dragon Ball, Mario y Minions lo superan.','Pero el 97 % de sus ingresos viene de los cines y solo tiene 2 de los 16 negocios. No hay juguetes, ni parque, ni videojuegos: cuando no hay estreno, la saga desaparece.','Por eso cae al puesto 39. El barómetro premia a las marcas que viven más allá de la sala, y aquí está la gran oportunidad del terror: experiencias, exposiciones y eventos de Halloween durante todo el año.'],fig:['10,6×','la taquilla sobre el presupuesto']},
  en:{t:'Profitable is not the same as strong: The Conjuring Universe',dek:'It makes 10 times its budget and still ranks 39th.',b:['The Conjuring Universe is one of the best businesses in film: its box office is 10.6 times what its movies cost. Only Demon Slayer, Dragon Ball, Mario and Minions do better.','But 97% of its revenue comes from cinemas and it has only 2 of the 16 businesses. No toys, no park, no games: between releases, the saga disappears.','That is why it falls to 39th. The barometer rewards brands that live beyond the cinema, and that is horror’s big opportunity: experiences, exhibitions and Halloween events all year round.'],fig:['10.6×','box office over budget']}}];
function allPosts(){return [TL].concat(POSTS);}
function rJournal(){
  $('journal').innerHTML=hdr('Journal',L('Notas del barómetro','Notes from the barometer'),L('Historias que salen de los datos. Cada nota enlaza con la ficha de la franquicia protagonista.','Stories that come out of the data. Each note links to the profile of the franchise it features.'))+
  `<div class="journal">${allPosts().map((p,i)=>{const t=p[LANG];return `<button type="button" class="post ${i===0?'feat':''}" data-post="${i}"><div class="cover">${cv(p.id)}</div><div class="meta">${p.long?L('Análisis','Analysis'):L('Nota','Note')} ${i+1} · ${L('Noviembre 2026','November 2026')} · ${t.b.join(' ').split(' ').length>0?Math.max(2,Math.round(t.b.join(' ').split(' ').length/180)):2} min</div><h3>${esc(t.t)}</h3><p>${esc(t.dek)}</p></button>`;}).join('')}</div>`;}
$('journal').addEventListener('click',e=>{const b=e.target.closest('[data-post]');if(b)openPost(Number(b.dataset.post));});
let lastFocus=null,drawerMode=null;
function openPost(i){const P=allPosts(),p=P[i],t=p[LANG],k=kOf(p.k);lastFocus=document.activeElement;drawerMode='post:'+i;
  $('drawer').innerHTML=`<div class="bar"><span class="kicker">Journal · ${p.long?L('Análisis','Analysis'):L('Nota','Note')} ${i+1}</span><button type="button" class="btn" data-f="close" aria-label="${L('Cerrar','Close')}">✕</button></div>
  <article class="article" style="display:flex;flex-direction:column;gap:16px"><div class="cover">${cv(p.id)}</div><h2 id="f-name">${esc(t.t)}</h2><p class="dek">${esc(t.dek)}</p>
  <div class="bigfig"><b class="grad">${t.fig[0]}</b><span>${esc(t.fig[1])}</span></div>${t.b.map(x=>x==='[[CHART]]'?quadChart():x.startsWith('## ')?`<h3 style="font-size:24px;margin-top:8px">${esc(x.slice(3))}</h3>`:`<p>${esc(x)}</p>`).join('')}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-fopen="${k}">${L('Ver la ficha de','Open the profile of')} ${esc(sh(D[k][0]))}</button>${i+1<P.length?`<button type="button" class="btn" data-fpost="${i+1}">${L('Siguiente nota','Next note')} →</button>`:''}</div></article>`;
  $('drawer').classList.add('open');$('scrim').classList.add('open');$('drawer').scrollTop=0;$('drawer').querySelector('[data-f="close"]').focus({preventScroll:true});}

/* ===== Método ===== */
function rMethod(){
  $('metodologia').innerHTML=hdr(L('Metodología fija','Fixed methodology'),L('Cómo se calcula la nota','How the score is calculated'),L('La nota final (0–100) combina tres bloques con pesos fijos: Gusta, Vende y Engancha. Cada bloque suma sus indicadores con los pesos que ves abajo.','The final score (0–100) combines three blocks with fixed weights: Appeal, Business and Buzz. Each block adds up its indicators with the weights shown below.'),`<a class="btn" href="/barometer/metodologia/">${L('Leer la metodología completa','Read the full methodology')}</a>`)+
  `<div class="method">${Object.entries(G).map(([g,o])=>`<div class="glass" style="border-top:5px solid ${o.c}"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:26px;color:${o.t}">${gn(g)}</h3><span style="font-family:var(--display);font-weight:800;font-size:34px">${o.w} %</span></div><p style="margin:0;color:var(--muted);font-size:14px">${tx(o.des)}</p>${SUBS.filter(s=>s.g===g).map(s=>`<div class="mrow"><span>${sn(s)} <small style="color:var(--muted)">· ${tx(s.src)}</small></span><span>${s.w} %</span></div>`).join('')}</div>`).join('')}</div>`;}

/* ===== Ficha ===== */
function flower(r,size){const c=size/2,Rd=size/2-74;let g='';const petal=(len,w)=>`M0,0 C${w},${-len*.25} ${w},${-len*.8} 0,${-len} C${-w},${-len*.8} ${-w},${-len*.25} 0,0Z`;
  SUBS.forEach((s,i)=>{const a=i*45,v=r[s.k];g+=`<path d="${petal(Rd,24)}" transform="translate(${c} ${c}) rotate(${a})" style="fill:rgba(var(--paper-rgb),.5);stroke:rgba(var(--ink-rgb),.14)" stroke-dasharray="4 4"/>`;
    if(v)g+=`<path d="${petal(Math.max(8,Rd*v/100),24)}" transform="translate(${c} ${c}) rotate(${a})" style="fill:${G[s.g].c}" fill-opacity=".88"/>`;
    const rad=a*Math.PI/180,lx=c+Math.sin(rad)*(Rd+38),ly=c-Math.cos(rad)*(Rd+38);
    g+=`<text x="${lx.toFixed(1)}" y="${(ly-3).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:var(--muted)">${sn(s)}</text><text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="800" style="fill:${v==null?'var(--muted)':G[s.g].t}">${v==null?L('sin dato','no data'):n0(v)}</text>`;});
  g+=`<circle cx="${c}" cy="${c}" r="38" style="fill:var(--paper);stroke:var(--ink)" stroke-width="2"/><text x="${c}" y="${c+8}" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-size="23" font-weight="800" style="fill:var(--ink)">${n1(r.idx)}</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img" aria-label="${esc(nm(r.name))}">${g}</svg>`;}
function openFicha(k){S.sel=k;location.hash='ficha-'+slug(D[k][0]);}
function renderFicha(){const r=R[S.sel],d=r.d,b=best(r),e=E[r.k],m=motor(r);drawerMode='ficha';
  const note=d[14]?(LANG==='en'?NOTE_EN[d[14]]||d[14]:d[14]):'';
  $('drawer').innerHTML=`<div class="bar"><div style="display:flex;gap:6px"><button type="button" class="btn" data-f="prev" aria-label="${L('Puesto anterior','Previous rank')}">←</button><button type="button" class="btn" data-f="next" aria-label="${L('Puesto siguiente','Next rank')}">→</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn" data-f="cmp">${L('Añadir al comparador','Add to comparison')}</button><button type="button" class="btn" data-f="uni">${L('Ver su universo','See its universe')}</button><button type="button" class="btn" data-f="close" aria-label="${L('Cerrar ficha','Close profile')}">✕</button></div></div>
    <div class="kicker" style="color:var(--muted)"><i class="dot" style="background:${OCOL[r.o]};margin-right:6px"></i>${orig(r.o)} · ${r.films} ${r.films===1?L('película','film'):L('películas','films')} ${L('con nota','rated')} · ${L('desde','since')} ${YEAR[r.name]}</div>
    <h2 id="f-name">${esc(nm(r.name))}</h2>
    <div class="ficha-score"><span class="n num grad">${n1(r.idx)}</span><span><b style="font-size:20px">${L('Puesto','Rank')} ${r.rank} ${L('de','of')} 41</b><br><span style="color:var(--muted)">${L('Nota final sobre 100','Final score out of 100')}</span></span></div>
    <div class="power"><b>${L('Superpoder','Superpower')}: ${sn(b.s)}.</b> ${L('Puesto','Rank')} ${b.rk}${b.ties?L(' (empatada con ',' (tied with ')+b.ties+')':''} ${L('de','of')} 41. ${esc(rawLong(r,b.s.k))}.</div>
    ${note?`<div class="note"><b style="color:var(--e-t)">${L('Ojo con el dato','Data note')}:</b> ${esc(note)}.</div>`:''}
    <div class="gcards">${Object.entries(G).map(([g,o])=>`<div class="gcard" style="border-top-color:${o.c}"><div style="font-size:12.5px;font-weight:700;color:${o.t}">${gn(g)} · ${o.w} %</div><div class="v num">${n1(r[g])}</div><div style="font-size:12.5px;color:var(--muted)">${L('Puesto','Rank')} ${grank(r,g)} ${L('de','of')} 41</div></div>`).join('')}</div>
    <div style="display:flex;justify-content:center">${flower(r,440)}</div>
    <div>${SUBS.map(s=>{const v=r[s.k];const rk=v==null?null:R.filter(x=>x[s.k]!=null&&x[s.k]>v+1e-9).length+1;return `<div class="ind"><span class="nm" style="color:${G[s.g].t}">${sn(s)}</span><div class="tr"><span style="width:${v??0}%;background:${G[s.g].c}"></span></div><b class="num">${n0(v)}</b><span class="raw">${esc(rawLong(r,s.k))}${rk?' · '+L('puesto','rank')+' '+rk+' '+L('de','of')+' 41':''} · <i>${tx(s.src)}</i></span></div>`;}).join('')}</div>
    <div class="blk"><h3 style="font-size:20px">${L('De dónde vienen sus ingresos','Where its revenue comes from')} · ${bn(d[7])}</h3>${revBar(r)}${revLeg(r)}<span style="font-size:13px">${m.share<.02?L('Casi todo su negocio está en el cine y el vídeo.','Almost all its business is cinema and video.'):`<span style="color:var(--gold)">★</span> ${L('Motor fuera de la pantalla','Off-screen engine')}: <b>${rln(m.i)}</b> (${pct(m.share)})`}</span></div>
    <div><h3 style="font-size:20px;margin-bottom:10px">${L('Ecosistema','Ecosystem')} · ${n1(d[9])} ${L('puntos','points')}</h3><div class="ecoF">${CATS.map((c,j)=>{const code=e.codes[j],col=CG[c.g].c;return `<div data-tipc="${j}" data-ek="${r.k}"><i style="${isY(code)?`background:${col};color:#fff`:isP(code)?`border:2px dashed ${col};color:${col};background:var(--paper)`:'border:1.5px solid rgba(var(--ink-rgb),.12);color:rgba(var(--ink-rgb),.28)'}">${icon(c.id,20)}</i>${cs(j)}</div>`;}).join('')}</div><p class="foot"><b style="color:var(--ink)">${L('Parque','Park')}:</b> ${esc(parkTxt(e)||L('Sin parque temático.','No theme park.'))}</p></div>`;
  $('drawer').classList.add('open');$('scrim').classList.add('open');$('drawer').scrollTop=0;}
function closeDrawer(){$('drawer').classList.remove('open');$('scrim').classList.remove('open');drawerMode=null;if(location.hash.startsWith('#ficha-')){try{history.replaceState(null,'',location.pathname+location.search);}catch(x){}}if(lastFocus)lastFocus.focus({preventScroll:true});}
$('drawer').addEventListener('click',e=>{const op=e.target.closest('[data-fopen]');if(op){openFicha(Number(op.dataset.fopen));return;}const np=e.target.closest('[data-fpost]');if(np){openPost(Number(np.dataset.fpost));return;}
  const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;if(f==='close')return closeDrawer();if(f==='cmp')return addCmp(S.sel);
  if(f==='uni'){const k=S.sel;closeDrawer();selOrbit(k,true);return;}
  const t=byRank(),i=t.findIndex(x=>x.k===S.sel);openFicha(t[(i+(f==='next'?1:-1)+41)%41].k);});

/* ===== Tooltip ===== */
function tipHTML(el){
  if(el.dataset.tipt)return esc(el.dataset.tipt);
  if(el.dataset.tl)return tlTip(el.dataset.tl);
  const k=Number(el.dataset.ek),e=E[k];
  if(el.dataset.tipc!=null){const j=Number(el.dataset.tipc),c=CATS[j],code=e.codes[j],col=isY(code)?'#86EFAC':isP(code)?'#FCD34D':'#CBD5E1';
    return `<b>${cn(j)}</b> · ${esc(sh(e.r.name))}<br><span class="st" style="background:${col}">${stn(code)}</span><br>${esc(det(e,j))}<span class="def">${tx(CATDEF[c.id])}</span>`;}
  if(el.dataset.tips){const s=SUBS.find(x=>x.k===el.dataset.tips);return `<b>${sn(s)}</b> · ${esc(sh(e.r.name))}<br>${esc(rawLong(e.r,s.k))}<span class="def">${L('Puntos','Points')}: ${n1(e.r[s.k])} / 100 · ${tx(s.src)}</span>`;}
  if(el.dataset.tipr!=null){const i=Number(el.dataset.tipr),a=revLines(e.r);return `<b>${rln(i)}</b> · ${esc(sh(e.r.name))}<br>${bn(a[i])} (${pct(a[i]/e.r.d[7])})`;}
  if(el.dataset.tipm){const r=R[Number(el.dataset.tipm)],m=motor(r);return `<b>${L('Motor fuera del cine','Off-screen engine')}</b> · ${esc(sh(r.name))}<br>${rln(m.i)}: ${bn(m.v)} (${pct(m.share)} ${L('del total','of total')})<span class="def">${L('Cine','Box office')}: ${pct(m.cine)}</span>`;}
  return '';}
document.addEventListener('mousemove',e=>{const t=$('tip');if(document.body.classList.contains('dragging')){t.style.display='none';return;}
  const el=e.target.closest('[data-tipc],[data-tips],[data-tipr],[data-tipm],[data-tipt],[data-tl]');
  if(el){t.innerHTML=tipHTML(el);t.style.display='block';const w=t.offsetWidth,h=t.offsetHeight;let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=e.clientY-h-16;t.style.left=x+'px';t.style.top=y+'px';return;}
  const rd=e.target.closest('[data-pk]');if(rd){const en=E[Number(rd.dataset.pk)];const cts=citiesOf(en.r.name);t.innerHTML=`<b>${esc(nm(en.r.name))}</b> · ${L('puesto','rank')} ${en.r.rank}<br>${esc(parkTxt(en)||L('Sin parque temático','No theme park'))}${cts.length?`<span class="def">${cts.map(cityN).join(' · ')}</span>`:''}`;t.style.display='block';const w=t.offsetWidth,h=t.offsetHeight;let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=e.clientY-h-16;t.style.left=x+'px';t.style.top=y+'px';return;}
  const bub=e.target.closest('.bub');if(bub){const r=R[Number(bub.dataset.k)];t.innerHTML=`<b>${esc(nm(r.name))}</b><br>${L('Puesto','Rank')} ${r.rank} · ${n1(r.idx)}<br>${esc(axName(S.mx))}: ${S.mx==='yr'?r.yr:n1(r[S.mx])}<br>${esc(axName(S.my))}: ${S.my==='yr'?r.yr:n1(r[S.my])}`;t.style.display='block';t.style.left=Math.min(e.clientX+16,innerWidth-260)+'px';t.style.top=(e.clientY+16)+'px';return;}
  t.style.display='none';});

/* ===== Arrastrar y soltar ===== */
(function(){let st=null,ghost=null,over=null,sup=false;
  document.addEventListener('pointerdown',e=>{if(e.button!==0)return;const s=e.target.closest('[data-drag]');if(!s||e.target.closest('select,input,[data-sort],[data-rmd],[data-rmc]'))return;if(e.pointerType!=='mouse'&&s.tagName==='TR'&&!e.target.closest('.grip'))return;st={id:s.getAttribute('data-drag'),x:e.clientX,y:e.clientY,on:false};});
  document.addEventListener('pointermove',e=>{if(!st)return;if(!st.on){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<7)return;st.on=true;const k=Number(st.id.split(':')[1]);
      ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=`<i class="dot" style="background:${OCOL[D[k][1]]}"></i>${esc(nm(D[k][0]))}`;document.body.appendChild(ghost);document.body.classList.add('dragging');
      document.querySelectorAll('[data-drop]').forEach(d=>d.setAttribute('data-active',''));}
    e.preventDefault();ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest('[data-drop]');if(over!==t){if(over)over.classList.remove('over');over=t;if(over)over.classList.add('over');}},{passive:false});
  const end=c=>{if(!st)return;const s=st;st=null;if(!s.on)return;sup=true;setTimeout(()=>sup=false,0);ghost.remove();document.body.classList.remove('dragging');document.querySelectorAll('[data-active]').forEach(d=>d.removeAttribute('data-active'));
    const t=over;if(over)over.classList.remove('over');over=null;if(c||!t)return;const k=Number(s.id.split(':')[1]);if(t.getAttribute('data-drop')==='orbit')selOrbit(k);else addCmp(k);};
  document.addEventListener('pointerup',()=>end(false));document.addEventListener('pointercancel',()=>end(true));
  document.addEventListener('click',e=>{if(sup){e.stopPropagation();e.preventDefault();sup=false;}},true);})();

/* ===== Asistente matIAs ===== */
const CH={open:false,msgs:[],busy:false,ctrl:null,sample:null};
function chatContext(){
  const lines=byRank().map(r=>{const e=E[r.k],m=motor(r),a=revLines(r),t=r.d[7];
    return [r.rank,nm(r.name),n1(r.idx),'G'+n1(r.E),'V'+n1(r.D),'En'+n1(r.P),
      'pub'+n0(r.I),'cri'+n0(r.H),'osc'+n0(r.M),'ing'+n0(r.Q),'eco'+n0(r.T),'ren'+n0(r.V),'seg'+n0(r.X),'bus'+n0(r.AC),
      'RT '+n1(r.d[3])+'%','CinemaScore '+(r.d[4]==null?'—':n1(r.d[4])),'Oscars '+r.d[5]+'/'+r.d[6],'películas '+r.films,
      'ingresos '+n1(t)+' mil M$ (cine '+n1(r.d[8])+')','reparto: '+a.map((v,i)=>v>0?RL[i][0]+' '+Math.round(v/t*100)+'%':'').filter(Boolean).join(', '),
      'taquilla/presupuesto '+(r.d[11]==null?'—':n1(r.d[11])+'x'),'Instagram '+(r.d[12]==null?'sin cuenta global':n1(r.d[12]/1000)+'M'),'Trends '+n1(r.d[13])+' (Star Wars=100)',
      'dueño '+e.owner,'origen '+ORIG[r.o],'desde '+YEAR[r.name],'amplitud '+n1(r.d[9])+'/15',
      'negocios sí: '+CATS.map((c,j)=>isY(e.codes[j])?tx(CN[c.id]):'').filter(Boolean).join(', '),
      'parciales: '+CATS.map((c,j)=>isP(e.codes[j])?tx(CN[c.id])+' ('+stn(e.codes[j])+')':'').filter(Boolean).join(', '),
      'parque: '+(parkTxt(e)||'no')+(citiesOf(r.name).length?' ['+citiesOf(r.name).join(', ')+']':''),
      r.d[14]?'nota: '+r.d[14]:''].filter(Boolean).join(' | ');});
  const tlx=(typeof TLD==='undefined')?'':'\n\nLÍNEA DE TIEMPO (piloto, taquilla mundial M$ The Numbers):\n'+Object.keys(TLD).map(k=>{const d=TLD[k];return D[k][0]+': películas '+d.films.map(f=>f[0]+' '+f[1]+(f[3]!=null?' '+Math.round(f[3]):'')+(f[4]==='a'?' (anunciada)':'')).join('; ')+' || hitos '+d.ev.map(e=>e[0]+' '+e[4]).join('; ');}).join('\n');
  return lines.join('\n')+tlx;}
function chatSystem(){return `${L('Eres el asistente de datos de matIAs plAIground para el Franchise Brand Barometer 2026. Responde en español.','You are the matIAs plAIground data assistant for the Franchise Brand Barometer 2026. Answer in English.')}
${L('Reglas','Rules')}:
- ${L('Responde solo con los datos de abajo. Si algo no está en los datos, dilo claramente y no lo inventes.','Answer only from the data below. If something is not in the data, say so plainly and do not make it up.')}
- ${L('Sé breve y directo: 2–5 frases o una lista corta. Usa cifras concretas de los datos.','Be brief and direct: 2–5 sentences or a short list. Use concrete figures from the data.')}
- ${L('Los tres bloques de la nota se llaman Gusta (50 %), Vende (30 %) y Engancha (20 %). No uses otros nombres para ellos.','The three blocks of the score are called Appeal/Gusta (50%), Business/Vende (30%) and Buzz/Engancha (20%). Do not use any other names for them.')}
- ${L('Puedes usar **negrita** y listas con guiones.','You may use **bold** and dash lists.')}
${L('Metodología','Methodology')}: nota final = 0,5×Gusta + 0,3×Vende + 0,2×Engancha (0–100). Gusta = 51% público (CinemaScore) + 34% crítica (Rotten Tomatoes) + 15% Óscar. Vende = 40% ingresos (escala logarítmica, cine ×2) + 30% ecosistema (amplitud de 15 y reparto de ingresos) + 30% rentabilidad (taquilla/presupuesto, 4× = 100). Engancha = media de seguidores de Instagram y búsquedas en Google Trends. 16 tipos de negocio revisados por franquicia.
${L('Columnas','Columns')}: puesto | franquicia | nota | G=Gusta V=Vende En=Engancha | puntos 0–100 de público, crítica, Óscar, ingresos, ecosistema, rentabilidad, seguidores, búsquedas | datos reales…
DATOS:
${chatContext()}`;}
function md(s){let h=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const out=[];let inl=false;h.split('\n').forEach(l=>{const m=l.match(/^\s*[-•]\s+(.*)/);if(m){if(!inl){out.push('<ul>');inl=true;}out.push('<li>'+m[1]+'</li>');}else{if(inl){out.push('</ul>');inl=false;}if(l.trim())out.push('<p>'+l+'</p>');}});if(inl)out.push('</ul>');return out.join('');}
const SUGG=()=>[L('¿Por qué Marvel gana a Star Wars?','Why does Marvel beat Star Wars?'),L('¿Qué franquicias tienen parque en París?','Which franchises have a park in Paris?'),L('¿Cuál es la más rentable y por qué no está más arriba?','Which is the most profitable and why isn’t it higher?'),L('Compara Pokémon y Barbie','Compare Pokémon and Barbie')];
function rChat(){
  $('chat').innerHTML=`<button type="button" class="chatfab" id="chatfab" aria-expanded="${CH.open}" aria-controls="chatpanel" aria-label="${L('Pregunta sobre los datos','Ask about the data')}"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2l1.8 5.4L19 9.2l-5.2 1.8L12 16.4l-1.8-5.4L5 9.2l5.2-1.8z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z" opacity=".75"/></svg></button>
  <section class="chatpanel glass" id="chatpanel" role="dialog" aria-label="${L('Asistente de datos','Data assistant')}" ${CH.open?'':'hidden'}>
   <header class="chathead"><span class="chatav" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l1.8 5.4L19 9.2l-5.2 1.8L12 16.4l-1.8-5.4L5 9.2l5.2-1.8z"/></svg></span><div><b class="mp">mat<b>IA</b>s</b><small>${L('Pregunta lo que quieras sobre las 41 franquicias','Ask anything about the 41 franchises')}</small></div><button type="button" class="icobtn" id="chatclose" aria-label="${L('Cerrar','Close')}" style="width:34px;height:34px;margin-left:auto">✕</button></header>
   <div class="chatlog" id="chatlog" aria-live="polite"></div>
   <form class="chatform" id="chatform"><label class="sr" for="chatin">${L('Tu pregunta','Your question')}</label><textarea id="chatin" rows="1" placeholder="${L('Escribe tu pregunta…','Type your question…')}"></textarea><button type="submit" class="chatsend" aria-label="${L('Enviar','Send')}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
  </section>`;
  chatLog();}
function chatLog(){const log=$('chatlog');if(!log)return;
  log.innerHTML=(CH.msgs.length?'':`<div class="cmsg bot"><p>${L('Hola, soy el asistente de <b>matIAs plAIground</b>. Conozco las notas, los indicadores, el ecosistema y los parques de las 41 franquicias. ¿Qué quieres saber?','Hi, I’m the <b>matIAs plAIground</b> assistant. I know the scores, indicators, ecosystems and parks of all 41 franchises. What would you like to know?')}</p></div><div class="csugg">${SUGG().map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`)+
   CH.msgs.map(m=>`<div class="cmsg ${m.role==='user'?'me':'bot'}${m.err?' err':''}">${m.role==='user'?`<p>${esc(m.content)}</p>`:(m.content?md(m.content):`<p class="typing"><i></i><i></i><i></i></p>`)}</div>`).join('');
  log.scrollTop=log.scrollHeight;}
async function chatAsk(q){q=q.trim();if(!q||CH.busy)return;
  if(!CH.sample){CH.msgs.push({role:'user',content:q},{role:'assistant',content:L('El asistente no está disponible en esta vista de la página.','The assistant is not available in this view of the page.'),err:true});chatLog();return;}
  CH.busy=true;CH.msgs.push({role:'user',content:q});const ans={role:'assistant',content:''};CH.msgs.push(ans);chatLog();
  const hist=CH.msgs.filter(m=>m!==ans&&!m.err).slice(-9).map(m=>({role:m.role,content:m.content}));hist[0]={role:'user',content:chatSystem()+'\n\n'+L('Pregunta','Question')+': '+hist[0].content};
  if(hist[0].role!=='user')hist.shift();
  CH.ctrl=new AbortController();
  try{const r=await CH.sample(hist,{onText:({text})=>{ans.content=text;chatLog();},signal:CH.ctrl.signal,cache:false,modelTier:'default'});ans.content=r.text||ans.content;}
  catch(e){ans.err=true;ans.content=e&&e.code==='rate_limited'?L('Demasiadas preguntas seguidas. Espera un momento y vuelve a intentarlo.','Too many questions in a row. Wait a moment and try again.'):e&&e.code==='not_granted'?L('El asistente necesita tu permiso para responder. Vuelve a preguntar y acepta el aviso.','The assistant needs your permission to answer. Ask again and accept the prompt.'):L('No he podido responder. Inténtalo de nuevo.','I could not answer. Please try again.');}
  CH.busy=false;chatLog();}
$('chat').addEventListener('click',e=>{if(e.target.closest('#chatfab')){CH.open=!CH.open;$('chatpanel').hidden=!CH.open;$('chatfab').setAttribute('aria-expanded',CH.open);if(CH.open)setTimeout(()=>$('chatin').focus(),50);return;}
  if(e.target.closest('#chatclose')){CH.open=false;$('chatpanel').hidden=true;$('chatfab').setAttribute('aria-expanded',false);$('chatfab').focus();return;}
  const s=e.target.closest('[data-q]');if(s)chatAsk(s.dataset.q);});
$('chat').addEventListener('submit',e=>{e.preventDefault();const t=$('chatin');const q=t.value;t.value='';chatAsk(q);});
$('chat').addEventListener('keydown',e=>{if(e.target.id==='chatin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatform').requestSubmit();}});
(async()=>{try{if(window.claude&&claude.use){CH.sample=await claude.use('sample');}}catch(e){CH.sample=null;}
  if(!CH.sample)document.documentElement.classList.add('nochat');})();

renderAll();route();
</script>
