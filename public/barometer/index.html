<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franchise Brand Barometer · plaiground</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Plataforma de una sola página: podio, ranking, ecosistema (universos, quién tiene qué, perfiles, imperios, combos, parques), récords, mapa, comparador, journal y método. */
:root{
  --bg:#EEF0FA; --ink:#14162E; --muted:#555A7A; --ink-rgb:20,22,46; --paper-rgb:255,255,255; --paper:#fff;
  --accent:#4338CA;
  --e:#FF7A59; --d:#4338CA; --p:#19B5A5; --e-t:#B93A0E; --d-t:#4338CA; --p-t:#0A6E63;
  --o1:#4338CA; --o2:#FF7A59; --o3:#19B5A5; --o4:#E0A100;
  --gold:#E0A100; --silver:#8C93B0; --bronze:#C26A3D; --up:#15803D; --down:#C2410C;
  --shadow:0 14px 44px rgba(28,30,80,.13); --blend:multiply; --blob:.55;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0D1F; --ink:#ECEEFF; --muted:#A3A8CC; --ink-rgb:236,238,255; --paper-rgb:26,29,58; --paper:#1A1D3A;
  --accent:#8B8CF8; --d:#6E6CF0; --e-t:#FF9F86; --d-t:#B3B8FF; --p-t:#5EE3CF; --o1:#6E6CF0;
  --up:#4ADE80; --down:#FB923C; --shadow:0 14px 44px rgba(0,0,0,.4); --blend:screen; --blob:.32;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;animation:hue 26s ease-in-out infinite alternate}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--blob);mix-blend-mode:var(--blend)}
.bg i:nth-child(1){width:55vw;height:55vw;left:-14vw;top:-20vw;background:var(--o1);animation:f1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:46vw;height:46vw;right:-12vw;top:-8vw;background:var(--o2);animation:f2 22s ease-in-out infinite alternate}
.bg i:nth-child(3){width:48vw;height:48vw;left:20vw;bottom:-26vw;background:var(--o3);animation:f3 30s ease-in-out infinite alternate}
.bg i:nth-child(4){width:30vw;height:30vw;right:4vw;bottom:-10vw;background:var(--o4);animation:f1 34s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,rgba(var(--paper-rgb),.3),rgba(var(--paper-rgb),.62))}
@keyframes f1{to{transform:translate(14vw,10vw) scale(1.15)}}
@keyframes f2{to{transform:translate(-16vw,14vw) scale(.9)}}
@keyframes f3{to{transform:translate(-10vw,-12vw) scale(1.2)}}
@keyframes hue{to{filter:hue-rotate(28deg)}}
@keyframes flow{to{background-position:200% 50%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.glass{background:rgba(var(--paper-rgb),.55);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid rgba(var(--paper-rgb),.7);box-shadow:inset 0 1px 0 rgba(var(--paper-rgb),.95),inset 0 -1px 0 rgba(var(--paper-rgb),.3),var(--shadow);border-radius:26px;position:relative;isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(var(--paper-rgb),.6),rgba(var(--paper-rgb),0) 38%,rgba(var(--paper-rgb),0) 70%,rgba(var(--paper-rgb),.25))}
:root[data-theme="dark"] .glass{border-color:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),var(--shadow)}
:root[data-theme="dark"] .glass::before{background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 40%)}
.grad{background:linear-gradient(100deg,var(--d),var(--accent),var(--e),var(--p),var(--d));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
.btn{border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.62);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600;min-height:40px;box-shadow:inset 0 1px 0 rgba(var(--paper-rgb),1);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(var(--paper-rgb),.95)}
:root[data-theme="dark"] .btn{border-color:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(110deg,var(--d),var(--accent),var(--p),var(--e),var(--d));background-size:200% 100%;animation:flow 8s linear infinite;color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;max-width:calc(100% - 24px)}
.nav .brand{display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(110deg,var(--d),var(--accent),var(--p),var(--e),var(--d));background-size:200% 100%;animation:flow 8s linear infinite;flex:none}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.links a{padding:9px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.links a:hover{color:var(--ink);background:rgba(var(--paper-rgb),.6)}
.links a.on{background:var(--ink);color:var(--bg)}
.ctrls{display:flex;gap:6px;align-items:center;padding-left:6px;border-left:1px solid rgba(var(--ink-rgb),.1);flex:none}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;background:rgba(var(--paper-rgb),.4);border-radius:999px;padding:4px;border:1px solid rgba(var(--paper-rgb),.8)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.icobtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.6);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.page{max-width:1340px;margin:0 auto;padding:96px 24px 140px;display:flex;flex-direction:column;gap:96px}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.shead h2{font-size:clamp(28px,3.4vw,42px);line-height:1.05;margin-top:6px}
.shead p{margin:8px 0 0;color:var(--muted);max-width:660px}
.foot{font-size:13px;color:var(--muted);margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.5);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.sel,.search{border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.7);border-radius:999px;padding:8px 14px;min-height:40px}
.search{width:210px}

/* Marca matIAs plAIground */
.mp{font-family:var(--display);font-weight:700;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
.mp b{font-weight:800;background:linear-gradient(100deg,var(--d),var(--accent),var(--e),var(--p),var(--d));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.nav .brand .mp{font-size:17px}
.byline{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:-10px}
.mp.big{font-size:clamp(26px,3vw,36px)}
.byline .sep{width:36px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--e))}
.sitefoot .flegal{flex-basis:100%;font-size:12.5px}.sitefoot .flegal a{color:inherit;text-decoration:none}.sitefoot .flegal a:hover{text-decoration:underline}
.sitefoot{max-width:1292px;margin:0 auto 110px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}


.fbbmark{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.fbbicon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(110deg,var(--d),var(--accent),var(--p),var(--e),var(--d));background-size:200% 100%;animation:flow 8s linear infinite;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.fbbname{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.8vw,34px);letter-spacing:-.02em}
.fbbed{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:5px 12px}


/* Asistente */
.chatfab{position:fixed;right:22px;bottom:20px;z-index:60;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(110deg,var(--d),var(--accent),var(--p),var(--e),var(--d));background-size:200% 100%;animation:flow 8s linear infinite;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.chatfab:hover{transform:scale(1.06)}
.chatfab[aria-expanded="true"]{transform:rotate(20deg)}
.nochat .chatfab{display:none}
.chatpanel{position:fixed;right:22px;bottom:94px;z-index:60;width:min(400px,calc(100% - 24px));height:min(600px,calc(100vh - 140px));display:flex;flex-direction:column;overflow:hidden;background:rgba(var(--paper-rgb),.86)!important;border-radius:24px}
.chatpanel[hidden]{display:none}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;border-bottom:1px solid rgba(var(--ink-rgb),.08)}
.chathead .mp{font-size:18px;display:block}
.chathead small{font-size:12.5px;color:var(--muted)}
.chatav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(110deg,var(--d),var(--accent),var(--p),var(--e));flex:none}
.chatlog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cmsg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5}
.cmsg p{margin:0 0 6px}.cmsg p:last-child{margin:0}
.cmsg ul{margin:4px 0 6px;padding-left:18px}.cmsg li{margin:2px 0}
.cmsg.bot{background:rgba(var(--paper-rgb),.9);border:1px solid rgba(var(--ink-rgb),.06);align-self:flex-start;border-bottom-left-radius:6px}
.cmsg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.cmsg.err{border-color:var(--e)}
.csugg{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.csugg button{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:rgba(var(--paper-rgb),.7);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.csugg button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.typing{display:flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.chatform{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(var(--ink-rgb),.08)}
.chatform textarea{flex:1;resize:none;border:1px solid rgba(var(--ink-rgb),.12);background:rgba(var(--paper-rgb),.9);border-radius:16px;padding:10px 12px;font:inherit;font-size:14px;max-height:110px;color:var(--ink)}
.chatsend{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);display:grid;place-items:center;flex:none;align-self:flex-end}
@media (max-width:760px){.chatpanel{right:12px;bottom:88px}.chatfab{right:12px;bottom:84px;width:54px;height:54px}}

/* Héroe */
.hero{display:flex;flex-direction:column;gap:28px;padding-top:12px}
.hero h1{font-size:clamp(40px,6.4vw,84px);line-height:.98;max-width:1000px}
.hero .lede{font-size:18px;color:var(--muted);max-width:680px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.fact b{font-family:var(--display);font-size:17px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end}
.pod{padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;animation:rise .6s ease-out both}
.pod:hover{transform:translateY(-4px);transition:transform .25s}
.pod.p1{padding-top:30px;padding-bottom:26px}
.pod .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,0,0,.15);flex:none}
.pod h3{font-size:clamp(24px,2.6vw,34px);line-height:1.02}
.pod.p1 h3{font-size:clamp(30px,3.2vw,44px)}
.pod .sc{font-family:var(--display);font-weight:800;font-size:48px;line-height:1}
.pod.p1 .sc{font-size:64px}
.pod .orig{font-size:13px;color:var(--muted);font-weight:600}
.eq{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:92px}
.eq div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.eq span{width:100%;border-radius:6px 6px 3px 3px;min-height:3px}
.eq small{font-size:10.5px;color:var(--muted);font-weight:600}
.eqlab{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--muted);text-align:center;font-weight:600;line-height:1.15}
.pod .pw{font-size:13.5px;background:rgba(var(--paper-rgb),.6);border-radius:14px;padding:10px 12px}
.next{display:flex;flex-wrap:wrap;gap:8px}
.next button{border:1px solid rgba(var(--paper-rgb),.8);background:rgba(var(--paper-rgb),.5);border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.next button b{font-family:var(--display);width:24px;height:24px;border-radius:50%;background:rgba(var(--ink-rgb),.08);display:grid;place-items:center;font-size:12px}
/* Ranking */
.tbl-wrap{overflow:auto;max-height:78vh;border-radius:26px}
table{border-collapse:separate;border-spacing:0;width:100%}
.heat{min-width:1100px}
.heat th,.heat td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(var(--paper-rgb),.6);font-size:14px}
.heat thead th,.mx thead th,.co thead th{position:sticky;top:0;z-index:3;background:rgba(var(--paper-rgb),.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.heat thead tr:first-child th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:14px}
.heat thead tr:nth-child(2) th{top:38px}
.heat .gh{border-bottom:3px solid}
.heat th button,.mx thead th button{border:0;background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:8px;line-height:1.15}
.heat th button:hover{color:var(--ink);background:rgba(var(--paper-rgb),.7)}
.heat th[aria-sort] button{color:var(--ink)}
.stick{position:sticky;left:0;z-index:2;background:rgba(var(--paper-rgb),.94)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-align:left!important}
thead .stick{z-index:4!important}
.heat tbody tr,.mx tbody tr{cursor:pointer;touch-action:pan-x pan-y}
.heat tbody tr:hover td,.mx tbody tr:hover td{background-color:rgba(var(--paper-rgb),.55)}
.who2{display:flex;align-items:center;gap:10px;min-width:230px}
.rk{font-family:var(--display);font-weight:800;font-size:18px;width:28px;text-align:right;flex:none}
.who2 b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who2 small{font-size:12px;color:var(--muted)}
@media (max-width:640px){
 .who2{min-width:0;width:150px;gap:6px}
 .who2 b{font-size:13.5px;max-width:112px;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .who2 small{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
 .heat td.stick,.mx td.stick,.heat th.stick,.mx th.stick{padding-left:6px!important;padding-right:6px!important;width:1%}
 .rk{font-size:14px!important;width:22px!important;letter-spacing:-.04em}
 .who2 .grip{width:26px;height:34px;background:rgba(var(--ink-rgb),.06)}
 .heat td,.heat th{padding:6px 4px}
 .heat .cell{min-width:56px;padding:6px 6px;font-size:13px}
 .tbl-wrap,.mxwrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
 .mx .nmc{min-width:0;width:138px;padding-left:4px}
 .mx .nmc b{font-size:13.5px;max-width:138px;white-space:normal;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .mx .nmc small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:138px;display:block;margin-top:2px}
 .mx th,.mx td{padding:5px 3px}
 .mx thead th button{font-size:10.5px;padding:6px 2px}
 .mx .motor{font-size:11.5px;padding:4px 8px}
}
.grip{width:22px;height:28px;display:grid;place-items:center;color:var(--muted);touch-action:none;flex:none;border-radius:6px}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:7px 8px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.idxc{display:flex;align-items:center;gap:8px;min-width:130px}
.idxc .b{flex:1;height:8px;border-radius:999px;background:rgba(var(--paper-rgb),.7);overflow:hidden}
.idxc .b span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--e),var(--d),var(--p),var(--e));background-size:200% 100%;animation:flow 6s linear infinite}
.idxc b{font-family:var(--display);font-size:18px;font-weight:800;width:42px;text-align:right}
.est{color:var(--e-t);font-weight:700}
/* Universos */
.uni{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;gap:18px;align-items:start}
.ulist{padding:14px;display:flex;flex-direction:column;gap:8px}
.ulist .search{width:100%}
.uscroll{max-height:640px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;scrollbar-width:thin}
.erow{display:grid;width:100%;grid-template-columns:24px minmax(0,1fr) 38px;gap:8px;align-items:center;border:0;background:transparent;padding:8px;border-radius:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.erow:hover{background:rgba(var(--paper-rgb),.7)}
.erow[aria-current="true"]{background:var(--ink);color:var(--bg)}
.erow[aria-current="true"] .rkn{color:var(--bg)}
.erow .nm2{display:flex;flex-direction:column;gap:4px;min-width:0}
.erow .nm2 b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkn{font-weight:800;color:var(--muted);font-size:13px}
.stackbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:rgba(var(--ink-rgb),.08)}
.stackbar span{height:100%}
.erow .am{font-family:var(--display);font-weight:800;text-align:right}
.orbitcard{padding:14px;min-width:0}
.orbit svg{display:block;margin:0 auto}
.spin{transform-box:view-box;transform-origin:300px 300px;animation:spin 140s linear infinite}
.up{transform-box:fill-box;transform-origin:center;animation:spin 140s linear infinite reverse}
.orbit:hover .spin,.orbit:hover .up{animation-play-state:paused}
.node{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:center;cursor:help}
.legend2{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600;justify-content:center}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.insight{padding:20px;display:flex;flex-direction:column;gap:14px}
.insight h3{font-size:24px}
.blk{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.icl{display:flex;flex-wrap:wrap;gap:6px}
.icl span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(var(--paper-rgb),.7);cursor:help}
.icl span i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.twin{display:flex;align-items:center;gap:12px;border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.6);border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left;width:100%;color:inherit}
.twin b{font-family:var(--display);font-size:18px}
.opp{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-size:13.5px}
.opp i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;border:2px dashed}
.revbar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.revbar span{height:100%}
.revleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-weight:600}
.revleg span{display:inline-flex;align-items:center;gap:5px}
/* Quién tiene qué */
.mxwrap{overflow:auto;max-height:78vh;border-radius:26px}
.mx{min-width:1180px}
.mx th,.mx td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(var(--paper-rgb),.6)}
.mx thead th{vertical-align:bottom}
.mx thead th button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;font-size:11px;width:100%}
.mx thead th button:hover,.mx thead th[aria-sort] button{background:rgba(var(--paper-rgb),.85);color:var(--ink)}
.mx td.hl,.mx th.hl{background-color:rgba(var(--paper-rgb),.5)}
.dt{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;box-sizing:border-box;position:relative;cursor:help}
.dt.N{border:1.5px solid rgba(var(--ink-rgb),.15)}
.star{position:absolute;top:-9px;right:-11px;font-size:14px;line-height:1;color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.nmc{display:flex;flex-direction:column;min-width:200px;padding-left:12px}
.nmc b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.nmc small{font-size:12px;color:var(--muted)}
.motor{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:help}
/* Perfiles */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.prof{padding:20px;display:flex;flex-direction:column;gap:12px}
.prof .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.prof h3{font-size:22px}
.prof p{margin:0;font-size:14px;color:var(--muted)}
.prof .count{font-family:var(--display);font-weight:800;font-size:15px}
.pm{display:flex;flex-direction:column;gap:4px}
.pmrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;border:0;background:rgba(var(--paper-rgb),.55);padding:7px 10px;border-radius:12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.pmrow:hover{background:rgba(var(--paper-rgb),.9)}
.pmrow b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;align-items:end;height:22px}
.tri span{border-radius:3px;min-height:2px}
/* Imperios */
.empires{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.emp{padding:18px;display:flex;flex-direction:column;gap:10px}
.emp h3{font-size:24px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.emp .who{font-size:12.5px;color:var(--muted);margin-top:-6px}
.emp .st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.emp .st div{background:rgba(var(--paper-rgb),.6);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted);font-weight:600}
.emp .st b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.cov{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.cov i{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-style:normal;cursor:help}
.cov i svg{width:70%;height:70%}
/* Combos */
.combowrap{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.combotop{padding:18px;display:flex;flex-direction:column;gap:12px}
.pair{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:rgba(var(--paper-rgb),.6)}
.pair .ic2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;font-size:13.5px}
.pair .ic2 i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;color:#fff}
.co{min-width:780px}
.co th,.co td{padding:3px;text-align:center}
.co th{font-size:10.5px;color:var(--muted);font-weight:700}
.co tbody th{position:sticky;left:0;z-index:2;background:rgba(var(--paper-rgb),.94);text-align:left;white-space:nowrap;padding:3px 10px;font-size:12px;color:var(--ink)}
.co tbody th span{display:inline-flex;align-items:center;gap:6px}
.co td span{display:grid;place-items:center;height:34px;min-width:34px;border-radius:8px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:help}
.co td.diag span{background:var(--ink)!important;color:var(--bg)!important}
/* Parques */
.ecostats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.ecostats button{border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.5);border-radius:18px;padding:12px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:130px}
.ecostats button b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.ecostats button span{font-size:13px;color:var(--muted);font-weight:600}
.ecostats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ecostats button[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.tkey{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px}
.tkey i{display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;perspective:900px}
.ticket{position:relative;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:22px;background:rgba(var(--paper-rgb),.62);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 14px 34px rgba(28,30,80,.14);transition:transform .15s ease-out;
  -webkit-mask:radial-gradient(circle at 0 70%,transparent 13px,#000 14px) left/51% 100% no-repeat,radial-gradient(circle at 100% 70%,transparent 13px,#000 14px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 70%,transparent 13px,#000 14px) left/51% 100% no-repeat,radial-gradient(circle at 100% 70%,transparent 13px,#000 14px) right/51% 100% no-repeat}
.ticket .band{height:10px;border-radius:22px 22px 0 0;background-size:200% 100%;animation:flow 7s linear infinite}
.ticket.op-Disney .band{background-image:linear-gradient(110deg,#3B5BDB,#7C3AED,#3B5BDB)}
.ticket.op-Universal .band{background-image:linear-gradient(110deg,#0EA5E9,#14B8A6,#0EA5E9)}
.ticket.op-Otros .band{background-image:linear-gradient(110deg,#F97316,#E0A100,#F97316)}
.ticket.op-none .band{background:rgba(var(--ink-rgb),.12);animation:none}
.ticket.st-A .band{background:repeating-linear-gradient(90deg,var(--accent) 0 12px,transparent 12px 20px);animation:none}
.ticket.st-N{background:rgba(var(--paper-rgb),.35)}
.ticket.st-N h3{color:var(--muted)}
.ticket .tt{padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.ticket .adm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ticket h3{font-size:21px;line-height:1.05}
.ticket p{margin:0;font-size:13px;opacity:.85;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ticket .stub{border-top:2px dashed rgba(var(--ink-rgb),.18);padding:10px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stamp{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;border:2.5px solid currentColor;border-radius:8px;padding:4px 9px;transform:rotate(-6deg);display:inline-block}
.ticket:nth-child(4n+2) .stamp{transform:rotate(4deg)}.ticket:nth-child(4n+3) .stamp{transform:rotate(-10deg)}.ticket:nth-child(4n) .stamp{transform:rotate(2deg)}
.stamp.Y{color:var(--up)}.stamp.A{color:var(--accent)}.stamp.T,.stamp.L{color:#D97706}.stamp.N{color:var(--muted)}
.sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.5),transparent 45%);opacity:0;transition:opacity .2s}
.ticket:hover .sheen{opacity:1}
/* Récords */
.recgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.reccol{padding:18px;display:flex;flex-direction:column;gap:10px;border-top:6px solid}
.reccol h3{font-size:26px;display:flex;justify-content:space-between;align-items:baseline}
.reccol h3 small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:700}
.reccol>p{margin:0;font-size:13.5px;color:var(--muted)}
.rec{padding:14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;font:inherit;color:inherit;border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.6);border-radius:18px}
.rec:hover{background:rgba(var(--paper-rgb),.95)}
.rec .lb{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rec .who{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.rec .val{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.rec .sub{font-size:12.5px;color:var(--muted)}
/* Mapa */
.mapctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.mapctl label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chart{padding:12px;position:relative}
svg text{font-family:var(--body)}
.bub{cursor:pointer}
.bub:hover{stroke:var(--ink);stroke-width:2}
/* Comparador */
.cmpbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 20px}
.cpill{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(var(--paper-rgb),.75);border:2px solid}
.cpill button{width:28px;height:28px;border-radius:50%;border:0;background:rgba(var(--ink-rgb),.08);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
.dumb{padding:20px;display:flex;flex-direction:column;gap:4px}
.dumb h3,.mix h3{font-size:22px;margin-bottom:4px}
.drow{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:12px;align-items:center;min-height:38px}
.drow.major{min-height:48px}
.drow .lab{font-size:13.5px;font-weight:600}
.drow.major .lab{font-family:var(--display);font-weight:800;font-size:15px}
.track{position:relative;height:30px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,rgba(var(--ink-rgb),.15) 0 4px,transparent 4px 8px);transform:translateY(-50%)}
.track .rng{position:absolute;top:50%;height:8px;border-radius:999px;transform:translateY(-50%);opacity:.35}
.track .pt{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:help;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.drow .win{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsep{height:1px;background:rgba(var(--ink-rgb),.08);margin:6px 0}
.mix{padding:20px;display:flex;flex-direction:column;gap:14px}
.mixcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mixcard{border-radius:20px;padding:14px;background:rgba(var(--paper-rgb),.6);display:flex;flex-direction:column;gap:10px;border-top:5px solid}
.mixcard h4{margin:0;font-family:var(--display);font-size:18px}
.gbars{display:flex;flex-direction:column;gap:5px}
.gbar{display:grid;grid-template-columns:88px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.gbar .t{height:8px;border-radius:999px;background:rgba(var(--ink-rgb),.08);overflow:hidden}
.gbar .t span{display:block;height:100%;border-radius:999px}
/* Journal */
.journal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.post{border:0;padding:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;border-radius:26px;overflow:hidden}
.post .cover{aspect-ratio:16/10;border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow);transition:transform .3s}
.post:hover .cover{transform:translateY(-4px) scale(1.01)}
.post .cover svg{width:100%;height:100%;display:block}
.post .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);margin:14px 4px 6px}
.post h3{font-size:22px;line-height:1.12;margin:0 4px}
.post p{margin:8px 4px 0;color:var(--muted);font-size:14.5px}
.post.feat{grid-column:span 2}
.post.feat h3{font-size:32px}
.article .cover{border-radius:20px;overflow:hidden;aspect-ratio:16/9}
.article .cover svg{width:100%;height:100%;display:block}
.article h2{font-size:34px;line-height:1.08}
.article .dek{font-size:18px;color:var(--muted);margin:0}
.article p{font-size:16px;line-height:1.65;margin:0}
.bigfig{display:flex;align-items:baseline;gap:14px;padding:16px 18px;border-radius:18px;background:rgba(var(--paper-rgb),.7)}
.bigfig b{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}
/* Método */
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.method .glass{padding:20px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid rgba(var(--ink-rgb),.08);padding-top:8px}
.mrow span:last-child{font-weight:700}
/* Ficha */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:70;display:none}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(680px,calc(100% - 24px));z-index:71;overflow-y:auto;padding:22px;display:none;flex-direction:column;gap:18px;background:rgba(var(--paper-rgb),.86)!important}
.drawer.open,.scrim.open{display:flex}
.drawer .bar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.drawer h2{font-size:40px;line-height:1}
.ficha-score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ficha-score .n{font-family:var(--display);font-size:72px;font-weight:800;line-height:.9}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{border-radius:18px;padding:12px 14px;background:rgba(var(--paper-rgb),.7);border-top:4px solid}
.gcard .v{font-family:var(--display);font-size:28px;font-weight:800}
.ind{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(var(--ink-rgb),.07)}
.ind .nm{font-weight:700;font-size:14px}
.ind .raw{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-4px}
.ind .tr{height:10px;border-radius:999px;background:rgba(var(--ink-rgb),.07);overflow:hidden}
.ind .tr span{display:block;height:100%;border-radius:999px}
.ind b{font-family:var(--display);text-align:right;font-size:17px}
.note{border:1px dashed var(--e);border-radius:14px;padding:12px 14px;font-size:14px;background:rgba(var(--paper-rgb),.5)}
.power{border-radius:16px;padding:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,transparent),rgba(var(--paper-rgb),.6));font-size:14.5px}
.ecoF{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.ecoF div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;cursor:help}
.ecoF i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal}
/* Arrastrar, bandeja, tooltip */
[data-drag]{cursor:grab}
.ghost{position:fixed;z-index:100;pointer-events:none;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(var(--paper-rgb),.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.25);transform:translate(-50%,-130%) rotate(-3deg);display:flex;align-items:center;gap:8px;white-space:nowrap}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
[data-drop][data-active]{animation:pulse 1.4s ease-in-out infinite}
[data-drop].over{outline:2px solid var(--accent);outline-offset:2px}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px)}
.dock .t{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.dchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:60vw}
.dchip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:rgba(var(--paper-rgb),.8);font-size:13px;font-weight:700;white-space:nowrap}
.dchip button{width:24px;height:24px;border-radius:50%;border:0;background:rgba(var(--ink-rgb),.08);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.dzone{min-width:120px;min-height:36px;border-radius:999px;border:1.5px dashed rgba(var(--ink-rgb),.25);display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:600;padding:0 12px}
.tip{position:fixed;pointer-events:none;background:rgba(14,16,36,.94);color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;display:none;z-index:110;max-width:300px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.tip b{font-size:14px}
.tip .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;margin:4px 0;color:#14162E}
.tip .def{color:rgba(255,255,255,.7);display:block;margin-top:4px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(14,16,36,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:120}

/* Parque Barómetro */
.pkstats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pkst{border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.5);border-radius:18px;padding:10px 16px;cursor:pointer;display:flex;align-items:baseline;gap:8px;font:inherit;color:inherit}
.pkst b{font-family:var(--display);font-size:26px;font-weight:800}
.pkst span{font-size:13px;color:var(--muted);font-weight:600}
.pkst[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.pkst[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.pkwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.pkmap{padding:10px;overflow:hidden}
.pkmap svg{display:block}
.ride{cursor:pointer;transition:opacity .3s}
.ride .rideb{transition:transform .25s cubic-bezier(.2,.8,.2,1.4);transform-box:fill-box;transform-origin:center bottom;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.ride:hover .rideb,.ride.sel .rideb{transform:translateY(-6px) scale(1.12)}
.ride.sel .rideb path{stroke:var(--ink)!important;stroke-width:3}
@keyframes flag{50%{transform:scaleX(.6)}}
.pkside{padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:96px}
.pkleg{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid rgba(var(--ink-rgb),.07)}
.pkleg i{width:14px;height:14px;border-radius:5px}
.pkfact{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:rgba(var(--paper-rgb),.6);font-size:14px}
.pkfact b.grad{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.pkqueue{margin-top:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.qsign{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.queue{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.qp{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font:inherit;color:inherit;font-size:12.5px;font-weight:700;width:104px;text-align:center;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.qav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;box-shadow:0 6px 14px rgba(0,0,0,.15);border:3px solid var(--paper)}
.qrope{flex:none;width:26px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,#B91C1C 0 6px,#FCA5A5 6px 12px);margin-top:-24px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.city{display:grid;grid-template-columns:minmax(0,1fr) 34px;grid-template-areas:"n c" "b b";gap:6px 10px;align-items:center;border:1px solid rgba(var(--paper-rgb),.9);background:rgba(var(--paper-rgb),.55);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;text-align:left;position:relative}
.city:hover{background:rgba(var(--paper-rgb),.9)}
.city.on{background:var(--ink);color:var(--bg)}
.city .cn{grid-area:n;font-family:var(--display);font-weight:800;font-size:17px}
.city .cc{grid-area:c;font-family:var(--display);font-weight:800;font-size:20px;text-align:right}
.city .cbar{grid-area:b;height:8px;border-radius:999px;background:rgba(var(--ink-rgb),.08);overflow:hidden}
.city .cbar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#0EA5E9,#F97316);background-size:200% 100%;animation:flow 6s linear infinite}
.csoon{position:absolute;top:-8px;right:12px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px}

function compute(p){
  const pts=D.map(d=>3*d[5]+(d[6]-d[5])); const maxPts=Math.max(...pts);
  const P=D.map(d=>p.cw*d[8]+(d[7]-d[8])); const maxP=Math.max(...P);
  const aas=D.map(d=>d[12]).filter(v=>v!=null); const maxAA=Math.max(...aas);
  const maxAD=Math.max(...D.map(d=>d[13]));
  const lin=p.scale==='lin';
  const out=D.map((d,k)=>{
    const H=d[3],I=d[4],M=pts[k]/maxPts*100;
    const E=I==null?(0.34*H+0.15*M)/0.49:0.51*I+0.34*H+0.15*M;
    const Q=lin?P[k]/maxP*100:Math.log10(P[k]*1000)/Math.log10(maxP*1000)*100;
    const T=d[9]/15*100*(0.5+0.5*d[10]);
    const V=d[11]==null?null:Math.min(100,d[11]/p.cap*100);
    const Dl=V==null?(0.4*Q+0.3*T)/0.7:0.4*Q+0.3*T+0.3*V;
    const X=d[12]==null?null:(lin?d[12]/maxAA*100:Math.log10(d[12])/Math.log10(maxAA)*100);
    const AC=lin?d[13]/maxAD*100:Math.log10(d[13]+1)/Math.log10(maxAD+1)*100;
    const Pr=X==null?AC:(X+AC)/2;
    const s=p.wE+p.wD+p.wP||1;
    const cE=p.wE/s*E,cD=p.wD/s*Dl,cP=p.wP/s*Pr;
    return {k,name:d[0],o:d[1],films:d[2],H,I,M,E,Q,T,V,D:Dl,X,AC,P:Pr,cE,cD,cP,idx:cE+cD+cP,d};
  });
  const sorted=out.slice().sort((a,b)=>b.idx-a.idx);
  sorted.forEach((r,i)=>{r.rank=i+1;});
  return out;
}

function quadOf(r){const sE=R.map(x=>x.E).sort((a,b)=>a-b)[20],sP=R.map(x=>x.P).sort((a,b)=>a-b)[20];return r.E>=sE?(r.P>=sP?'a':'b'):(r.P>=sP?'c':'d');}
function quadChart(){const W=760,H=600,L0=70,R0=24,T0=30,B0=60;const mE=R.map(x=>x.E).sort((a,b)=>a-b)[20],mP=R.map(x=>x.P).sort((a,b)=>a-b)[20];
  const x0=20,x1=100,y0=55,y1=92;const X=v=>L0+(v-x0)/(x1-x0)*(W-L0-R0),Y=v=>H-B0-(v-y0)/(y1-y0)*(H-T0-B0);
  let g=`<rect x="${X(mP)}" y="${T0}" width="${W-R0-X(mP)}" height="${Y(mE)-T0}" fill="${QC.a}" opacity=".08"/><rect x="${L0}" y="${T0}" width="${X(mP)-L0}" height="${Y(mE)-T0}" fill="${QC.b}" opacity=".08"/><rect x="${X(mP)}" y="${Y(mE)}" width="${W-R0-X(mP)}" height="${H-B0-Y(mE)}" fill="${QC.c}" opacity=".08"/><rect x="${L0}" y="${Y(mE)}" width="${X(mP)-L0}" height="${H-B0-Y(mE)}" fill="${QC.d}" opacity=".1"/>`;
  g+=`<line x1="${X(mP)}" x2="${X(mP)}" y1="${T0}" y2="${H-B0}" style="stroke:rgba(var(--ink-rgb),.3)" stroke-dasharray="5 5"/><line x1="${L0}" x2="${W-R0}" y1="${Y(mE)}" y2="${Y(mE)}" style="stroke:rgba(var(--ink-rgb),.3)" stroke-dasharray="5 5"/>`;
  [['b',L0+10,T0+22,'start'],['a',W-R0-10,T0+22,'end'],['d',L0+10,H-B0-12,'start'],['c',W-R0-10,Y(mE)+24,'end']].forEach(([q,x,y,a])=>g+=`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="17" fill="${QC[q]}">${tx(QN[q])}</text>`);
  for(let v=20;v<=100;v+=20)g+=`<text x="${X(v)}" y="${H-B0+20}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${v}</text>`;
  for(let v=60;v<=90;v+=10)g+=`<text x="${L0-10}" y="${Y(v)+4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${v}</text>`;
  g+=`<text x="${(L0+W-R0)/2}" y="${H-14}" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--ink)">${L('Engancha: seguidores y búsquedas →','Buzz: followers and searches →')}</text><text transform="translate(20 ${(T0+H-B0)/2}) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--ink)">${L('Gusta: público, crítica y premios →','Appeal: audience, critics and awards →')}</text>`;
  const lab=new Set(['Marvel','Star Wars','Wizarding World (Harry Potter)','El Señor de los Anillos','Lilo & Stitch','Indiana Jones','El Rey León','Minecraft','Pokémon','One Piece','Fast & Furious','Men in Black','El Planeta de los Simios','Matrix','Toy Story','Frozen','Super Mario']);
  R.forEach(r=>{const q=quadOf(r);g+=`<circle cx="${X(r.P).toFixed(1)}" cy="${Y(r.E).toFixed(1)}" r="7" fill="${QC[q]}" style="stroke:var(--paper)" stroke-width="2" data-tipt="${esc(nm(r.name)+' · '+gn('E')+' '+n1(r.E)+' · '+gn('P')+' '+n1(r.P))}"/>`;
    const lft=['Indiana Jones','Pokémon'].includes(r.name),up=r.name==='Marvel';if(lab.has(r.name))g+=`<text x="${(X(r.P)+(up?-4:lft?-10:10)).toFixed(1)}" y="${(Y(r.E)+(up?-11:4)).toFixed(1)}" text-anchor="${up?'middle':lft?'end':'start'}" font-size="12" font-weight="700" style="fill:var(--ink);stroke:rgba(var(--paper-rgb),.9)" stroke-width="3" paint-order="stroke" pointer-events="none">${esc(sh(r.name).replace('Wizarding World','Harry Potter'))}</text>`;});
  return `<figure style="margin:0"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Gráfico de cuadrantes: Gusta frente a Engancha para las 41 franquicias','Quadrant chart: Appeal versus Buzz for the 41 franchises')}">${g}</svg><figcaption class="foot">${L('Las líneas discontinuas marcan la mediana de cada eje (Gusta 73,0 y Engancha 55,8). Pasa el ratón por un punto para ver la franquicia.','Dashed lines mark each axis median (Appeal 73.0, Buzz 55.8). Hover over a dot to see the franchise.')}</figcaption></figure>`;}
function quadCover(){const W=800,H=500;let dots='';R.forEach(r=>{const q=quadOf(r);dots+=`<circle cx="${(80+(r.P-20)/80*640).toFixed(0)}" cy="${(470-(r.E-55)/37*290).toFixed(0)}" r="10" fill="${QC[q]==='#94A3B8'?'#E2E8F0':'#fff'}" opacity="${q==='d'?.45:.9}"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338CA"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#gq)"/><line x1="${80+(55.8-20)/80*640}" y1="0" x2="${80+(55.8-20)/80*640}" y2="${H}" stroke="#fff" stroke-width="3" stroke-dasharray="10 10" opacity=".6"/><line x1="0" y1="${470-(73-55)/37*290}" x2="${W}" y2="${470-(73-55)/37*290}" stroke="#fff" stroke-width="3" stroke-dasharray="10 10" opacity=".6"/>${dots}<text x="40" y="90" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="84" fill="#fff">r = ${dec('0.10')}</text><text x="44" y="130" font-size="24" font-weight="700" fill="#fff">${L('entre lo que gusta y lo que engancha','between appeal and buzz')}</text></svg>`;}

 es:{t:'Querer no es seguir: la brecha entre el cariño y el enganche',dek:'Que una saga guste no garantiza que la gente la siga. Cruzamos las dos cosas en las 41 franquicias y aparecen cuatro maneras muy distintas de ser marca.',fig:['0,10','correlación entre Gusta y Engancha'],
  b:['En el negocio del entretenimiento se da por hecho que una gran película crea una gran comunidad. Si el público sale del cine encantado y la crítica aplaude, los seguidores llegarán solos. Los datos del Franchise Brand Barometer dicen lo contrario.',
  'Hemos cruzado dos bloques del índice. Gusta mide lo que sienten el público y la crítica, y los premios que consigue cada saga. Engancha mide el tamaño de su comunidad en Instagram y cuánto se la busca hoy en Google. La correlación entre ambos es de 0,10 sobre 1: prácticamente ninguna. Entre la nota de la crítica y el enganche, la relación es nula (0,02).',
  '[[CHART]]',
  '## Iconos completos: gustan y enganchan',
  'Son 13 sagas, y en ellas están las 3 primeras del ranking: Marvel, Star Wars y Harry Potter. Les acompañan Toy Story, Demon Slayer, Barbie, Dragon Ball o Avatar. Su nota media es 75,6, y 8 de las 13 tienen parque temático. No son las que más facturan, pero sí las más equilibradas: el cariño que generan en la sala se transforma en conversación fuera de ella.',
  '## Joyas dormidas: muy queridas, poco seguidas',
  'Aquí está la sorpresa del análisis. El Señor de los Anillos tiene la mejor nota de Gusta de las 41 (88,6) y es cuarta en el ranking, pero su enganche se queda en 49,5. Le acompañan Frozen, El Rey León, Indiana Jones, Dune, Kung Fu Panda, Lilo & Stitch y Misión Imposible.',
  'Estas 8 sagas ingresan de media 7,5 mil millones de dólares, la cifra más baja de los cuatro grupos. Tienen el prestigio, pero no la conversación. Es valor de marca que está ahí y no se está aprovechando: una comunidad digital activa, contenido entre estrenos o experiencias para fans podrían despertarlo.',
  '## Fenómenos de fans: más enganche que cariño',
  'Minecraft, Pokémon, One Piece, Super Mario, Gru y los Minions, Fast & Furious, Los Juegos del Hambre y Crepúsculo. Sus películas no entusiasman a la crítica (Pokémon tiene un 31 % de críticas positivas y Minecraft un 48 %), pero millones de personas las siguen y las buscan.',
  'Y aquí está el dato que más debería hacer pensar a una marca: estas 8 sagas son las que más facturan, con 24,1 mil millones de dólares de media, más que los iconos completos (20,8). El enganche, y no el aplauso, es lo que más se parece al negocio: la correlación entre Engancha y Vende es de 0,59, frente a 0,38 entre Gusta y Vende.',
  '## Sagas en pausa: ni una cosa ni otra',
  'Jurassic Park, Transformers, Piratas del Caribe, Cars, Cazafantasmas, Matrix, Men in Black o El Planeta de los Simios. Son 12 marcas con historia y con nombres que todo el mundo reconoce, pero hoy no destacan ni en cariño ni en comunidad. Su nota media es 60,1 y tienen de media 6,8 negocios fuera del cine, frente a 10,1 de los iconos. Necesitan una reinvención, no solo una secuela.',
  '## Tres lecciones para cualquier marca',
  '1. El enganche se construye fuera de la pantalla. Minecraft tiene una sola película y es la saga más buscada del barómetro. Pokémon saca menos del 1 % de sus ingresos del cine. La comunidad vive en el juego, en las cartas y en el móvil.',
  '2. El cariño sin comunidad es valor dormido. Las joyas dormidas tienen un público que ya las quiere. Lo que les falta es una razón para seguirlas el resto del año.',
  '3. Cada cuadrante tiene un movimiento natural. Las joyas dormidas deben activar a sus fans. Los fenómenos de fans deben cuidar la calidad para no quemar la marca. Las sagas en pausa deben repensar qué significan hoy. Y los iconos, defender su equilibrio.',
  '## Una nota sobre el método',
  'Los cortes son las medianas de las 41 franquicias: 73,0 en Gusta y 55,8 en Engancha. Algunas sagas no tienen cuenta oficial global en Instagram (Lilo & Stitch, Misión Imposible, Demon Slayer, Dragon Ball o Zootopia) y su enganche se calcula solo con búsquedas, así que su posición puede quedarse algo corta.',
  'La pregunta para cualquier responsable de marca es sencilla: ¿sabes en qué cuadrante está la tuya?']},
 en:{t:'Loved is not followed: the gap between affection and buzz',dek:'Being liked does not guarantee being followed. We crossed the two across 41 franchises and found four very different ways to be a brand.',fig:['0.10','correlation between Appeal and Buzz'],
  b:['The entertainment business takes it for granted that a great film builds a great community. If audiences leave the cinema delighted and critics applaud, followers will come on their own. The Franchise Brand Barometer data says otherwise.',
  'We crossed two blocks of the index. Appeal measures what audiences and critics feel, plus the awards each saga wins. Buzz measures the size of its Instagram community and how much people search for it on Google today. The correlation between the two is 0.10 out of 1: practically none. Between critics’ scores and buzz, there is no relationship at all (0.02).',
  '[[CHART]]',
  '## Complete icons: loved and followed',
  'There are 13 sagas here, including the top 3 of the ranking: Marvel, Star Wars and Harry Potter, joined by Toy Story, Demon Slayer, Barbie, Dragon Ball and Avatar. Their average score is 75.6 and 8 of the 13 have a theme park. They are not the biggest earners, but they are the most balanced: the affection they create in the cinema turns into conversation outside it.',
  '## Sleeping gems: deeply loved, barely followed',
  'This is the surprise of the analysis. The Lord of the Rings has the highest Appeal of all 41 (88.6) and ranks fourth overall, yet its Buzz is only 49.5. It sits alongside Frozen, The Lion King, Indiana Jones, Dune, Kung Fu Panda, Lilo & Stitch and Mission: Impossible.',
  'These 8 sagas earn an average of $7.5 billion, the lowest of the four groups. They have the prestige but not the conversation. That is brand value sitting idle: an active digital community, content between releases or fan experiences could wake it up.',
  '## Fan phenomena: more buzz than love',
  'Minecraft, Pokémon, One Piece, Super Mario, Despicable Me and the Minions, Fast & Furious, The Hunger Games and Twilight. Their films do not excite critics (Pokémon has 31% positive reviews and Minecraft 48%), yet millions of people follow and search for them.',
  'And here is the figure that should make any brand think: these 8 sagas earn the most, $24.1 billion on average, more than the complete icons ($20.8 billion). Buzz, not applause, is what most resembles business: the correlation between Buzz and Business is 0.59, versus 0.38 between Appeal and Business.',
  '## Sagas on pause: neither one nor the other',
  'Jurassic Park, Transformers, Pirates of the Caribbean, Cars, Ghostbusters, The Matrix, Men in Black and Planet of the Apes. These are 12 brands with history and names everyone knows, but today they stand out for neither affection nor community. Their average score is 60.1 and they have 6.8 businesses beyond cinema on average, versus 10.1 for the icons. They need reinvention, not just a sequel.',
  '## Three lessons for any brand',
  '1. Buzz is built off screen. Minecraft has a single film and is the most searched saga in the barometer. Pokémon earns less than 1% of its revenue from cinema. The community lives in the game, the cards and the phone.',
  '2. Love without community is sleeping value. The sleeping gems already have an audience that loves them. What they lack is a reason to follow them the rest of the year.',
  '3. Each quadrant has a natural move. Sleeping gems should activate their fans. Fan phenomena should protect quality so they do not burn the brand. Sagas on pause should rethink what they mean today. And icons should defend their balance.',
  '## A note on method',
  'The cut-offs are the medians of the 41 franchises: 73.0 for Appeal and 55.8 for Buzz. Some sagas have no global official Instagram account (Lilo & Stitch, Mission: Impossible, Demon Slayer, Dragon Ball and Zootopia), so their buzz comes from searches alone and their position may be slightly understated.',
  'The question for any brand owner is simple: do you know which quadrant yours is in?']}};
