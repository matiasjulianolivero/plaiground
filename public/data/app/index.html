<title>Data plaiground · Plataforma (beta)</title>

<style>
:root{--bg:#F4F5FB;--ink:#14162E;--muted:#555A7A;--line:rgba(20,22,46,.10);--paper:#fff;--soft:#E6E8F5;
--ind:#4338CA;--c1:#4338CA;--c2:#FF7A59;--c3:#19B5A5;--c4:#E0A100;--good:#0F8A5F;--bad:#C2410C;--grid:rgba(20,22,46,.08);
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;--cta-bg:#14162E;--cta-fg:#fff;color-scheme:light}
html[data-theme="dark"]{--bg:#0B0D1F;--ink:#ECEEFF;--muted:#A3A8CC;--line:rgba(236,238,255,.12);--paper:#15183A;--soft:#22264F;
--ind:#8B8CF8;--c1:#7B7CF0;--c2:#E8603A;--c3:#139E90;--c4:#BD8600;--good:#4ADE9B;--bad:#FB923C;--grid:rgba(236,238,255,.08);--cta-bg:#ECEEFF;--cta-fg:#14162E;color-scheme:dark}
*{box-sizing:border-box;min-width:0}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
a{color:var(--ind)}:focus-visible{outline:3px solid var(--ind);outline-offset:3px;border-radius:10px}
.proto{background:#FF7A59;color:#14162E;font-size:13px;font-weight:600;text-align:center;padding:7px 16px}
.proto a{color:#14162E}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:12px}
.brand{text-decoration:none;color:var(--ink);font:700 22px var(--display);letter-spacing:-.045em}.brand .ai{color:var(--ind)}
.brand small{font:600 12px var(--body);letter-spacing:0;color:var(--muted);margin-left:8px;padding-left:9px;border-left:1px solid var(--line)}
.sub{font:600 13px var(--body);color:var(--muted);text-decoration:none;padding-left:10px;border-left:1px solid var(--line)}.sub:hover{color:var(--ink)}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--ind);color:#fff;display:grid;place-items:center;font:700 11px var(--body);font-style:normal;flex:none}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.lang button{border:0;background:transparent;font:700 12px var(--body);color:var(--muted);padding:6px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cta-bg);color:var(--cta-fg)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px}
@media (max-width:640px){.chip{display:none}.brand small{display:none}}
main{max-width:1280px;margin:0 auto;padding:36px 24px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 20px;border-radius:999px;font:600 15px var(--body);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s,background .15s}
.btn.pri{background:#4338CA;color:#fff}.btn.pri:hover{background:#3730A3}
.btn.pri[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line)}.btn.sec:hover{border-color:var(--ink)}
.btn.link{background:none;color:var(--muted);padding:12px 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px}
.muted{color:var(--muted)}
label.f{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input[type=email],input[type=url],input[type=text],select,textarea{width:100%;font:16px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ind)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:var(--bad);margin-top:6px;min-height:1em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:16px}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#4338CA}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;min-height:calc(100vh - 220px)}
@media (max-width:860px){.login{grid-template-columns:1fr;gap:24px}}
.login h1{font-size:clamp(34px,4.4vw,54px);line-height:1.02;font-weight:800;margin:14px 0}
.login ul{padding:0;list-style:none;margin:22px 0 0}.login li{display:flex;gap:10px;margin:10px 0}
.login li b{flex:none;width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--ind) 14%,transparent);color:var(--ind);display:grid;place-items:center;font-size:13px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ind)}
.sent{max-width:520px;margin:6vh auto;text-align:center}
.sent .env{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:color-mix(in srgb,var(--ind) 14%,transparent);display:grid;place-items:center;color:var(--ind)}
.sent .env svg{width:40px;height:40px}
.mailbox{text-align:left;margin:24px 0;border:1px dashed var(--line);border-radius:18px;padding:16px 18px;background:var(--bg);font-size:14px}
.mailbox b{display:block}

/* home */
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.head h1{font-size:clamp(28px,3.4vw,40px);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.dcard .th{height:118px;background:var(--soft);display:flex;align-items:flex-end;gap:5px;padding:16px 18px 0}
.dcard .th i{flex:1;border-radius:4px 4px 0 0;background:var(--c1)}.dcard .th i:nth-child(3n+2){background:var(--c3)}.dcard .th i:nth-child(4n){background:var(--c2)}
.dcard .bd{padding:16px 18px;flex:1}.dcard h3{font-size:18px;margin:0 0 4px}
.dcard .meta{font-size:13px;color:var(--muted)}
.dcard .ft{display:flex;gap:8px;padding:0 18px 16px}
.dcard .ft .btn{min-height:38px;padding:8px 14px;font-size:14px}
.empty{text-align:center;padding:56px 24px;border:2px dashed var(--line);border-radius:24px}
.empty h2{font-size:26px;margin:10px 0 8px}
.tag{display:inline-block;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ind);background:color-mix(in srgb,var(--ind) 12%,transparent);border-radius:999px;padding:3px 9px}

/* wizard */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.steps span{font-size:14px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.steps span.on{background:var(--cta-bg);color:var(--cta-fg);border-color:transparent}
.steps span.ok{color:var(--good)}
.wiz{max-width:820px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:transparent;font:600 14px var(--body);color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;min-height:42px}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--ind);background:color-mix(in srgb,var(--ind) 5%,transparent)}
.drop svg{width:38px;height:38px;color:var(--ind)}
.drop b{display:block;margin:8px 0 4px;font-size:17px}
.picked{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 10%,transparent);font-size:14px}
.picked .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#14162E;font:800 11px var(--body);flex:none}
.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.examples{grid-template-columns:1fr}}
.examples button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:14px;cursor:pointer;font:14px var(--body);color:var(--ink)}
.examples button b{display:block;font-size:15px;margin-bottom:2px}
.examples button[aria-pressed="true"]{border-color:var(--ind);box-shadow:0 0 0 3px color-mix(in srgb,var(--ind) 18%,transparent)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap}
.ai-note{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:color-mix(in srgb,var(--ind) 8%,transparent);border:1px solid color-mix(in srgb,var(--ind) 25%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.sug{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ind);margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media (max-width:640px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);font:600 14px var(--body);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--cta-bg);color:var(--cta-fg);border-color:transparent}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cols span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.cols span em{font-style:normal;color:var(--muted);margin-left:4px}

/* processing */
.proc{max-width:560px;margin:8vh auto}
.proc h2{font-size:30px;margin:0 0 18px}
.proc ol{list-style:none;padding:0;margin:0}
.proc li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:var(--muted);transition:color .2s}
.proc li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px}
.proc li.run{color:var(--ink)}.proc li.run i{border-color:var(--ind);border-top-color:transparent;animation:spin .8s linear infinite}
.proc li.done{color:var(--ink)}.proc li.done i{background:var(--good);border-color:var(--good);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.proc li.run i{animation:none}}

/* dashboard */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar h1{font-size:clamp(24px,3vw,34px);font-weight:800;flex:1 1 320px}
.bar .btn{min-height:40px;padding:9px 16px;font-size:14px}
.sentnote{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;background:color-mix(in srgb,var(--good) 10%,transparent);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:14px;padding:6px 14px;margin-bottom:10px}.sentnote .btn{min-height:34px;padding:6px 8px;color:var(--ind)}
.review{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:color-mix(in srgb,var(--bad) 9%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.understood{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.understood b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tile small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.tile b{display:block;font:800 clamp(22px,2.6vw,30px)/1.1 var(--display);letter-spacing:-.035em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;font-weight:700;display:block}.tile .d.up{color:var(--good)}.tile .d.down{color:var(--bad)}.tile .d span{color:var(--muted);font-weight:500}
.charts{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
.ch{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}
.ch h4{font:700 15px var(--body);margin:0 0 2px}.ch .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch svg text{font-family:var(--body);fill:var(--muted);font-size:11px}.ch svg .lab{fill:var(--ink);font-weight:600;font-size:12px}.ch svg .val{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--cta-bg);color:var(--cta-fg);font-size:13px;line-height:1.35;padding:8px 10px;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.insights{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ind);border-radius:18px;padding:18px 20px}
.insights .ih{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.insights h4{font:700 15px var(--body);margin:0}.insights ul{margin:0;padding-left:20px}.insights li{margin:6px 0}
.insights .rec{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-weight:600}
.tbl{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-top:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;background:var(--soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin-top:18px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(11,13,31,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--paper);border-radius:22px;padding:24px;max-width:480px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{font-size:22px;margin:0 0 8px}
.copyrow{display:flex;gap:8px;margin-top:12px}.copyrow input{flex:1;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cta-bg);color:var(--cta-fg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

@media print{.proto,.top,.bar .btn,.review,#tblBtn,.foot,.toast{display:none!important}body{background:#fff}main{padding:0}.ch,.tile,.insights,.understood{break-inside:avoid}}
</style>
</head>

<div class="proto" id="proto"></div>
<header class="top"><div class="in">
  <a class="brand" href="/" aria-label="plaiground · inicio">pl<span class="ai">ai</span>ground</a><a class="sub" href="/data/">Data</a>
  <span class="sp"></span>
  <span class="chip" id="userChip" hidden></span>
  <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
  <button class="icon-btn" type="button" id="themeBtn" aria-label="Tema / Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="icon-btn" type="button" id="logoutBtn" hidden></button>
</div></header>
<main id="app" aria-live="polite"></main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box" id="mBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="/data/engine.js"></script>

<script>
{
const H=document.documentElement,$=id=>document.getElementById(id),app=$('app');
const L=()=>H.getAttribute('data-lang')==='en'?'en':'es',tr=(es,en)=>L()==='en'?en:es;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='plg-data-demo';
let S={email:'',dash:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let MODE='demo',AI=false;
let view=S.email?'home':'login',draft=null,cur=null,tblOpen=false,flash='';
const api=async(path,opt={})=>{const r=await fetch(path,Object.assign({credentials:'same-origin',headers:{'content-type':'application/json'}},opt));let d={};try{d=await r.json()}catch(e){}return {ok:r.ok,status:r.status,data:d};};

/* ===== datos ficticios y motor del dashboard ===== */
const MONTHS={es:['dic','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov'],en:['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov']};
const MYEAR=['2025','2026','2026','2026','2026','2026','2026','2026','2026','2026','2026','2026'];
const CH=[{id:'search',es:'Paid Search',en:'Paid Search',c:'--c1'},{id:'social',es:'Paid Social',en:'Paid Social',c:'--c2'},{id:'email',es:'Email y CRM',en:'Email & CRM',c:'--c3'},{id:'seo',es:'SEO / Orgánico',en:'SEO / Organic',c:'--c4'}];
const noise=(i,k)=>{const x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)};
const series=(b,g,s,k)=>Array.from({length:12},(_,i)=>Math.round(b*Math.pow(1+g,i)*(s?s[i]:1)*(0.94+noise(i,k)*0.12)));
const SE=[1.25,.85,.88,.95,.97,1,.98,.92,.9,1,1.05,1.35],SF=[1.15,.9,.92,1,1.03,1.08,1.12,1.1,1,.98,1,1.05];
const BIZ={
 ecom:{label:{es:'E-commerce',en:'E-commerce'},name:{es:'Tienda online de moda',en:'Fashion online store'},
  vol:{search:series(42000,.01,SE,1),social:series(30000,.03,SE,2),email:series(17000,.006,SE,3),seo:series(23000,.026,SE,4)},

async function loadSource(kind,payload){draft.err='';draft.wb=null;draft.ctxDone=false;
 try{
  if(!window.XLSX||!window.PLGEngine)throw new Error('lib');
  if(kind==='file'){const f=payload,ext=f.name.split('.').pop().toLowerCase();
   if(ext==='pdf'){draft.err=tr('Los PDF llegarán pronto. Por ahora, exporta la tabla a Excel o CSV.','PDF support is coming soon. For now, export the table to Excel or CSV.');render();return;}
   if(!['xlsx','xls','csv'].includes(ext)){draft.err=tr('Formato no admitido. Usa Excel (.xlsx, .xls) o CSV.','Unsupported format. Use Excel (.xlsx, .xls) or CSV.');render();return;}
   if(f.size>20*1024*1024){draft.err=tr('El archivo supera los 20 MB.','The file is larger than 20 MB.');render();return;}
   draft.loading=f.name;render();
   const data=ext==='csv'?await f.text():await f.arrayBuffer();
   draft.wb=PLGEngine.readWorkbook(data,f.name);draft.source=f.name;draft.kind='file';}
  else if(kind==='sheets'){if(MODE!=='live'){draft.err=tr('Google Sheets está disponible al iniciar sesión.','Google Sheets is available once signed in.');render();return;}
   draft.loading='Google Sheets';render();
   const r=await fetch('/api/sheets?url='+encodeURIComponent(payload),{credentials:'same-origin'});
   if(!r.ok){const e=await r.json().catch(()=>({}));draft.loading=null;draft.err=e.error==='not_public'?tr('No podemos leer la hoja. Compártela como “Cualquiera con el enlace puede ver” y vuelve a intentarlo.','We can’t read the sheet. Share it as “Anyone with the link can view” and try again.'):tr('No se pudo leer la hoja. Revisa la URL.','Could not read the sheet. Check the URL.');render();return;}
   draft.wb=PLGEngine.readWorkbook(await r.arrayBuffer(),'Google Sheets');draft.source='Google Sheets';draft.kind='sheets';draft.gs=payload;}
  else{draft.wb=sampleWorkbook(payload);draft.sample=payload;draft.source=tr('Ejemplo','Sample')+' · '+BIZ[payload].name[L()];draft.kind='sample';}
  draft.loading=null;
  if(!draft.wb.sheets.length){draft.wb=null;draft.err=tr('No hemos encontrado ninguna tabla con cabeceras en el archivo.','We couldn’t find any table with headers in the file.');}
 }catch(e){console.error(e);draft.loading=null;draft.wb=null;draft.err=tr('No hemos podido leer el archivo. ¿Está protegido con contraseña o dañado?','We couldn’t read the file. Is it password-protected or damaged?');}
 render();}

async function prepareContext(){const pr=draft.prof=PLGEngine.profile(draft.wb);
 const names=draft.wb.sheets.filter(s=>s.columns.some(c=>c.type==='number')).map(s=>s.name).slice(0,6).join(', ');
 if(!draft.data)draft.data=tr('Datos de','Data from')+' '+names;
 if(!draft.goal)draft.goal=GOAL[draft.aud][L()];
 if(!draft.title)draft.title=(draft.kind==='file'?draft.source.replace(/\.[a-z]+$/i,''):draft.source).slice(0,60);
 if(draft.kind==='sample'&&!draft.bizType){draft.bizType=BIZ[draft.sample].label[L()];draft.data=DATA_DESC[draft.sample][L()];}
 draft.ctxSource='auto';
 if(MODE==='live'&&AI){draft.ctxLoading=true;go('new2');
  const r=await api('/api/ai/context',{method:'POST',body:JSON.stringify({profile:pr,lang:L()})});
  draft.ctxLoading=false;
  if(r.ok&&r.data.context){const c=r.data.context;draft.bizType=c.business_type||draft.bizType;if(c.company_name)draft.company=c.company_name;draft.data=c.data_description||draft.data;if(AUDK.includes(c.audience))draft.aud=c.audience;draft.goal=c.goal||draft.goal;draft.warnings=c.warnings||[];draft.ctxSource='ai';}
  else if(r.status===429)toast(tr('Has llegado al límite diario de análisis con IA. Se usará el análisis automático.','You reached the daily AI limit. The automatic analysis will be used.'));
  if(view==='new2')render();}
 else go('new2');
 draft.ctxDone=true;}

async function runProc(){const lis=[...document.querySelectorAll('#plist li')];let i=0;
 const step=()=>{if(i>0){lis[i-1].className='done';lis[i-1].querySelector('i').textContent='✓';}if(i<lis.length){lis[i].className='run';i++;}};
 const wait=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?20:ms));
 try{step();await wait(400);step();
  const lang=L(),facts=PLGEngine.facts(draft.wb,lang);await wait(300);step();
  let spec=null,mode='auto';
  if(MODE==='live'&&AI){const r=await api('/api/ai/analyze',{method:'POST',body:JSON.stringify({lang,profile:draft.prof||PLGEngine.profile(draft.wb),facts,context:{company:draft.company,bizType:draft.bizType,data:draft.data,goal:draft.goal,aud:draft.aud}})});
   if(r.ok&&r.data.spec){spec=r.data.spec;mode='ai';}else toast(r.status===429?tr('Límite diario de IA alcanzado: análisis automático.','Daily AI limit reached: automatic analysis.'):tr('La IA no respondió: usamos el análisis automático.','The AI didn’t respond: using the automatic analysis.'));}
  step();
  if(!spec)spec=PLGEngine.heuristicSpec(draft.wb,lang,facts,{company:draft.company});
  await wait(300);step();
  let comp=PLGEngine.compute(draft.wb,spec,lang);
  if(!comp.kpis.length&&!comp.charts.length){const h=PLGEngine.heuristicSpec(draft.wb,lang,facts,{company:draft.company});comp=PLGEngine.compute(draft.wb,h,lang);}
  const result={mode,summary:spec.summary||'',kpis:comp.kpis,charts:comp.charts,insights:spec.insights||[],opportunities:spec.opportunities||[],relationships:spec.relationships||[],
   actions:(spec.actions||[]).map(a=>({t:a.t,est:a.est||'',impact:a.impact||'',effort:a.effort||'',when:a.when||''})),ideas:spec.ideas||[],warnings:(spec.warnings||[]).concat(draft.warnings||[]).slice(0,4),cube:PLGEngine.buildCube(draft.wb,facts)};
  await wait(300);step();
  const d={v:2,id:Math.random().toString(36).slice(2,10),ts:Date.now(),title:draft.title||spec.title||tr('Mi dashboard','My dashboard'),aud:draft.aud,company:draft.company||'',bizType:draft.bizType||'',data:draft.data||'',goal:draft.goal||'',source:draft.source,lang,result};
  let emailed=false;if(MODE==='live'){const r=await api('/api/dashboards',{method:'POST',body:JSON.stringify(d)});if(!r.ok)toast(tr('No se pudo guardar en tu cuenta','Could not save to your account'));else emailed=!!r.data.emailed;}
  S.dash=S.dash.filter(x=>x.id!==d.id);S.dash.push(d);save();step();await wait(250);
  cur=d;draft=null;go('dash');toast(emailed?tr('Guardado. Te hemos enviado un email con el enlace.','Saved. We’ve emailed you the link.'):MODE==='live'?tr('Dashboard guardado en tu cuenta','Dashboard saved to your account'):tr('Dashboard creado','Dashboard created'));
 }catch(e){console.error(e);if($('procErr'))$('procErr').textContent=tr('Algo ha fallado al analizar el archivo. Inténtalo de nuevo o prueba con otro archivo.','Something went wrong analysing the file. Try again or use another file.');}}

 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L()));
 const logged=!!S.email&&!['login','sent'].includes(view);
 $('userChip').hidden=!logged;$('logoutBtn').hidden=!logged;
 if(logged){$('userChip').innerHTML=`<i>${esc(S.email[0].toUpperCase())}</i>${esc(S.email)}`;$('logoutBtn').setAttribute('aria-label',tr('Cerrar sesión','Sign out'));$('logoutBtn').title=tr('Cerrar sesión','Sign out');
  $('logoutBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>';}
 if(!S.email&&!['login','sent'].includes(view))view='login';
 app.innerHTML=V[view]();bind();
 if(view==='dash')paintDash();
 document.title=tr('Data plaiground · Plataforma (beta)','Data plaiground · Platform (beta)');}
function bind(){
 app.querySelectorAll('[data-act=home]').forEach(b=>b.onclick=()=>go('home'));
 app.querySelectorAll('[data-act=new]').forEach(b=>b.onclick=()=>{draft={tab:'file',aud:'ceo'};go('new1');});
 if(view==='login'){$('loginForm').onsubmit=async e=>{e.preventDefault();const em=$('em').value.trim(),ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
  $('emErr').textContent=ok?'':tr('Escribe un email válido.','Enter a valid email.');$('tErr').textContent=$('terms').checked?'':tr('Necesitas aceptar los términos para continuar.','You need to accept the terms to continue.');
  if(ok&&$('terms').checked){draft={email:em};S.lastEmail=em;save();
   if(MODE!=='live'){go('sent');return;}
   const btn=e.submitter||$('loginForm').querySelector('button');btn.disabled=true;btn.textContent=tr('Enviando…','Sending…');
   const r=await api('/api/auth/request',{method:'POST',body:JSON.stringify({email:em,accepted:true,lang:L()})});
   if(r.ok){flash='';go('sent');}else{btn.disabled=false;btn.textContent=tr('Recibir enlace de acceso','Send me an access link');
    $('emErr').textContent=r.status===429?tr('Has pedido demasiados enlaces. Espera un rato y vuelve a intentarlo.','Too many requests. Please wait a while and try again.'):r.data.error==='invalid_email'?tr('Escribe un email válido.','Enter a valid email.'):tr('No hemos podido enviar el email. Inténtalo de nuevo en unos minutos.','We couldn’t send the email. Please try again in a few minutes.');}}};}
 if(view==='sent'){$('back').onclick=()=>go('login');
  if(MODE==='live'){$('resend').onclick=async()=>{const r=await api('/api/auth/request',{method:'POST',body:JSON.stringify({email:draft.email,accepted:true,lang:L()})});$('rsMsg').style.color=r.ok?'var(--good)':'var(--bad)';$('rsMsg').textContent=r.ok?tr('Enlace reenviado.','Link resent.'):r.status===429?tr('Demasiados intentos. Espera un rato.','Too many attempts. Please wait.'):tr('No se pudo reenviar.','Could not resend.');};}
  else $('magic').onclick=()=>{S.email=draft.email;S.accepted=Date.now();save();toast(tr('Sesión iniciada','Signed in'));go('home');};}
 if(view==='home'&&$('delAcc'))$('delAcc').onclick=()=>{modal(`<h3 id="mTitle">${tr('¿Eliminar tu cuenta?','Delete your account?')}</h3><p class="muted">${tr('Se borrarán tu email, tus sesiones y todos tus dashboards. No se puede deshacer.','Your email, sessions and all your dashboards will be deleted. This cannot be undone.')}</p><div class="actions" style="justify-content:flex-end"><button class="btn sec" type="button" data-close>${tr('Cancelar','Cancel')}</button><button class="btn pri" type="button" id="okAcc" style="background:var(--bad)">${tr('Eliminar cuenta','Delete account')}</button></div>`);
  $('okAcc').onclick=async()=>{const r=await api('/api/me',{method:'DELETE'});closeModal();if(r.ok){S={email:'',dash:[]};save();toast(tr('Cuenta eliminada','Account deleted'));go('login');}else toast(tr('No se pudo eliminar la cuenta','Could not delete the account'));};};
 if(view==='home'){app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{cur=S.dash.find(d=>d.id===b.dataset.open);tblOpen=false;go('dash');});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const d=S.dash.find(x=>x.id===b.dataset.del);
   modal(`<h3 id="mTitle">${tr('¿Eliminar este dashboard?','Delete this dashboard?')}</h3><p class="muted">${tr('Se borrarán','This will delete')} “${esc(d.title)}” ${tr('y sus datos. No se puede deshacer.','and its data. This cannot be undone.')}</p><div class="actions" style="justify-content:flex-end"><button class="btn sec" type="button" data-close>${tr('Cancelar','Cancel')}</button><button class="btn pri" type="button" id="okDel" style="background:var(--bad)">${tr('Eliminar','Delete')}</button></div>`);
   $('okDel').onclick=()=>{S.dash=S.dash.filter(x=>x.id!==d.id);save();if(MODE==='live')api('/api/dashboards/'+d.id,{method:'DELETE'});closeModal();toast(tr('Dashboard eliminado','Dashboard deleted'));render();};});}
 if(view==='new1'){app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{draft.tab=b.dataset.tab;draft.err='';render();});
  const fi=$('file');if(fi){fi.onchange=()=>fi.files[0]&&loadSource('file',fi.files[0]);const dz=$('drop');['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
   ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));dz.addEventListener('drop',e=>e.dataTransfer.files[0]&&loadSource('file',e.dataTransfer.files[0]));}
  app.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>loadSource('sample',b.dataset.sample));
  $('next1').onclick=()=>{if(draft.tab==='sheets'&&!draft.wb){const u=$('gs').value.trim();if(!/^https:\/\/docs\.google\.com\/spreadsheets\/d\//.test(u)){draft.err=tr('Pega una URL de Google Sheets (empieza por https://docs.google.com/spreadsheets/d/).','Paste a Google Sheets URL (starts with https://docs.google.com/spreadsheets/d/).');render();return;}loadSource('sheets',u);return;}
   if(draft.wb){if(draft.ctxDone)go('new2');else prepareContext();}};}
 if(view==='new2'&&!draft.ctxLoading){const keep=()=>{draft.bizType=$('cBiz').value.trim();draft.company=$('cName').value.trim();draft.data=$('cData').value.trim();draft.goal=$('cGoal').value.trim();draft.title=$('cTitle').value.trim();};
  app.querySelectorAll('[data-aud]').forEach(b=>b.onclick=()=>{keep();const old=draft.aud;draft.aud=b.dataset.aud;if(!draft.goal||draft.goal===GOAL[old][L()])draft.goal=GOAL[draft.aud][L()];render();});
  $('back2').onclick=()=>{keep();go('new1');};
  $('gen').onclick=()=>{keep();if(!draft.title)draft.title=tr('Mi dashboard','My dashboard');go('proc');runProc();};}
 if(view==='dash'){if($('share'))$('share').onclick=()=>openShare();
  if($('pdf'))$('pdf').onclick=()=>{try{window.print()}catch(e){toast(tr('Usa Imprimir → Guardar como PDF en tu navegador','Use Print → Save as PDF in your browser'));}};
  if($('tblBtn'))$('tblBtn').onclick=()=>{tblOpen=!tblOpen;render();};
  if($('seeMail'))$('seeMail').onclick=()=>modal(`<h3 id="mTitle">${tr('Tu dashboard está listo','Your dashboard is ready')}</h3><p class="muted" style="margin:0 0 10px">${tr('De','From')}: noreply@plaigroundmarketing.com · ${tr('Para','To')}: ${esc(S.email)}</p>
   <p>${tr('Hola, ya puedes ver','Hi, you can now view')} <b>“${esc(cur.title)}”</b>.</p><p class="muted">${tr('Incluye 4 KPIs clave, 2 gráficos, insights, oportunidades y un plan de acción.','It includes 4 key KPIs, 2 charts, insights, opportunities and an action plan.')}</p>
   <a class="btn pri" href="#" data-close style="margin:6px 0 14px">${tr('Abrir dashboard','Open dashboard')}</a>
   <div class="picked" style="margin:0"><span class="ic" style="background:#FF7A59">PDF</span><div><b>${esc(cur.title)}.pdf</b><br><span class="muted">${tr('Adjunto','Attachment')} · 6 ${tr('páginas','pages')}</span></div></div>
   <p class="hint">${tr('Recuerda revisar los datos: la IA puede equivocarse. El link caduca en 30 días.','Remember to review the data: the AI can make mistakes. The link expires in 30 days.')}</p>
   <div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="btn sec" type="button" data-close>${tr('Cerrar','Close')}</button></div>`);}
}

document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{H.setAttribute('data-lang',b.dataset.l);H.lang=b.dataset.l;try{localStorage.setItem('plg-lang',b.dataset.l)}catch(e){}
 if(view==='new2'){draft.data=draft.data;}render();}));
$('themeBtn').onclick=()=>{const t=H.getAttribute('data-theme')==='dark'?'light':'dark';H.setAttribute('data-theme',t);try{localStorage.setItem('plg-theme',t)}catch(e){}if(view==='dash')paintDash();};
$('logoutBtn').onclick=async()=>{if(MODE==='live')await api('/api/auth/logout',{method:'POST'});S.email='';if(MODE==='live')S.dash=[];save();toast(tr('Sesión cerrada','Signed out'));go('login');};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(view==='dash'&&cur.v!==2){drawLine(derive(cur.biz));drawBars(cur.biz);}},150);});
boot();
async function boot(){
 const qp=new URLSearchParams(location.search),tok=qp.get('login');
 let me=null;
 try{const r=await fetch('/api/me',{credentials:'same-origin'});const d=await r.json().catch(()=>null);
  if(d&&(r.ok||(d.error==='unauthorized'&&d.configured!==false))){MODE='live';if(r.ok){me=d;AI=!!d.ai;}}}catch(e){}
 if(MODE==='live'){
  if(tok){const op0=qp.get('open');if(op0){try{localStorage.setItem('plg-open',op0)}catch(e){}}history.replaceState(null,'',location.pathname);app.innerHTML=`<div class="proc card"><h2>${tr('Entrando…','Signing in…')}</h2></div>`;
   const r=await api('/api/auth/verify',{method:'POST',body:JSON.stringify({token:tok,src:qp.get('next')==='ai-barometer'?'aibb':'data'})});
   if(r.ok&&qp.get('next')==='ai-barometer'){location.replace('/ai-barometer/');return;}
   if(r.ok){const m2=await api('/api/me');me=m2.ok?m2.data:{email:r.data.email};AI=!!(m2.ok&&m2.data.ai);toast(tr('Sesión iniciada','Signed in'));}else flash=tr('El enlace ha caducado o ya se usó. Pide uno nuevo.','The link has expired or was already used. Request a new one.');}
  const op=qp.get('open');if(op){try{localStorage.setItem('plg-open',op)}catch(e){}history.replaceState(null,'',location.pathname);}
  if(me){S.email=me.email;const r=await api('/api/dashboards');S.dash=r.ok?r.data.dashboards:[];view='home';
   let want=null;try{want=localStorage.getItem('plg-open');localStorage.removeItem('plg-open');}catch(e){}
   const hit=want&&S.dash.find(x=>x.id===want);if(hit){cur=hit;view='dash';}}
  else{S.email='';S.dash=[];view='login';}
  save();
 }
 render();
}
}
